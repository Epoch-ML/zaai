# DjangoGoat Static Security Analysis - OWASP Top 10 Code Remediation
name: "djangogoat"
category: "Static Code Analysis"
description: |
  Static code security analysis suite for DjangoGoat intentionally vulnerable Django application.
  Performs comprehensive static analysis to detect OWASP Top 10 vulnerabilities in the codebase,
  then fixes issues by directly editing environment files. All security fixes are verified through
  automated testing of the modified code patterns.

stages:
  - name: install system dependencies
    type: before
    description: Install Python 3.10, Poetry, Geckodriver, Firefox, and OWASP ZAP
    preconditions: System package managers are available
    postconditions: Python 3.10, Poetry, Geckodriver, Firefox, and ZAP are installed and available in PATH
    code_to_run: !python/file stages/install_system_dependencies.py

  - name: install dependencies
    type: before
    description: Install DjangoGoat dependencies using Poetry and cache environment
    preconditions: Poetry is available in the environment
    postconditions: All DjangoGoat dependencies are installed and environment cached
    code_to_run: !python/file stages/install_dependencies.py

specs:
  - description: "Detect and fix SQL injection vulnerabilities"
    preconditions: "Codebase contains SQL query construction code"
    postconditions: "SQL injection vulnerabilities are fixed - all queries use parameterized queries or ORM"

  - description: "Detect and fix cryptographic failures"
    preconditions: "Codebase contains cryptographic operations"
    postconditions: "Cryptographic failures are fixed - strong hashing and encryption algorithms are used"

  - description: "Detect and fix XSS vulnerabilities"
    preconditions: "Codebase contains template rendering and user input handling"
    postconditions: "XSS vulnerabilities are fixed - all user input is properly escaped"

  - description: "Detect and fix insecure design patterns"
    preconditions: "Codebase contains view functions and authentication logic"
    postconditions: "Insecure design patterns are fixed - proper authentication decorators are applied"

  - description: "Detect and fix security misconfiguration"
    preconditions: "Codebase contains application configuration"
    postconditions: "Security misconfiguration is fixed - secure settings and middleware are applied"

  - description: "Detect and fix vulnerable components"
    preconditions: "Project dependencies are specified"
    postconditions: "Vulnerable components are fixed - all packages are at secure versions"

  - description: "Detect and fix authentication failures"
    preconditions: "Codebase contains authentication and password handling"
    postconditions: "Authentication failures are fixed - secure password handling and validators are used"

  - description: "Detect and fix data integrity failures"
    preconditions: "Codebase contains form handling and input processing"
    postconditions: "Data integrity failures are fixed - all user input is validated"

  - description: "Detect and fix logging failures"
    preconditions: "Codebase contains logging and monitoring code"
    postconditions: "Logging failures are fixed - no sensitive data is exposed in logs"

  - description: "Detect and fix SSRF vulnerabilities"
    preconditions: "Codebase makes external HTTP requests"
    postconditions: "SSRF vulnerabilities are fixed - all external requests validate target URLs"

  - description: "Fix cookie HTTPOnly flag security issue"
    preconditions: "DjangoGoat application uses cookies without HTTPOnly flag enabled"
    postconditions: "All cookies are configured with HTTPOnly flag enabled in Django settings to prevent XSS cookie theft"

  - description: "Remove server version information leakage"
    preconditions: "Server exposes version information via Server HTTP response header"
    postconditions: "Server header is masked or removed to prevent information disclosure about server version and technology stack"

  - description: "Modify source code in-place with pinpointed changes"
    preconditions: "Codebase contains vulnerable code"
    postconditions: "Source files are edited directly with pinpointed changes - may create essential config files (.env, etc.) but no duplicate source files or helper/fix scripts. The only allowed helper script is the one to connect to the Zerg tests, namely 'security_interface.py', all tests on the top level folder and the security_changelog.md file in the root of the workspace."

  - description: "Handle Django migrations properly - do not modify existing migration files"
    preconditions: "Codebase contains Django migration files that need security-related schema changes"
    postconditions: "New migration files are created following Django naming conventions (numbered sequentially) that fix security issues - existing migration files in migrations/ directories are never modified, only new ones are created"

  - description: "Never modify the features/ folder"
    preconditions: "Environment contains a features/ directory with test scenarios or documentation"
    postconditions: "The features/ folder and all files within it remain completely untouched - no modifications, no additions, no deletions"

  - description: "Generate a Markdown SECURITY_CHANGELOG.md summary of security-related code changes."
    preconditions: "At least one file in the workspace has changed and the tool can write to the changelog location."
    postconditions: "A SECURITY_CHANGELOG.md file is created or updated to document all source changes and vulnerabilities fixed. The changelog maps each change to its associated vulnerability type (CVE/CWE-style) and includes a summary block in JSON format. No secret values are exposed. If no changes have been made, the check passes and the file is not created or updated."

tests:
  - description: "Run complete security scan with OWASP ZAP and verify all tests pass (ignoring CSP and Server Version Leaks warnings)"
    preconditions: "No preconditions required - test automatically starts and stops Django server"
    postconditions: |
      Django server starts successfully, full behave test suite passes with zero security alerts from ZAP (except CSP warnings and Server Version Leaks warnings), all functional tests passing, and server shuts down cleanly
    function_to_run: !python/file tests/test_full_security_scan.py

  - description: "Verify SQL injection vulnerabilities are fixed"
    preconditions: "Environment contains code with SQL injection fixes applied"
    postconditions: "No SQL injection patterns detected - all queries use parameterized queries or Django ORM"
    function_to_run: !python/file tests/test_sql_injection.py

  - description: "Verify cryptographic failures are fixed"
    preconditions: "Environment contains code with cryptographic fixes applied"
    postconditions: "No weak cryptography detected - all use strong hashing and encryption"
    function_to_run: !python/file tests/test_cryptographic_failures.py

  - description: "Verify XSS vulnerabilities are fixed"
    preconditions: "Environment contains code with XSS fixes applied"
    postconditions: "No XSS patterns detected - all user input properly escaped"
    function_to_run: !python/file tests/test_xss.py

  - description: "Verify insecure design patterns are fixed"
    preconditions: "Environment contains code with authentication fixes applied"
    postconditions: "No authentication bypass patterns detected - all views properly protected"
    function_to_run: !python/file tests/test_insecure_design.py

  - description: "Verify security misconfiguration is fixed"
    preconditions: "Environment contains settings.py with secure configuration"
    postconditions: "No security misconfigurations detected - secure Django settings applied"
    function_to_run: !python/file tests/test_security_misconfiguration.py

  - description: "Verify vulnerable components are fixed"
    preconditions: "Environment contains requirements.txt with updated dependencies"
    postconditions: "No vulnerable components detected - all packages at secure versions"
    function_to_run: !python/file tests/test_vulnerable_components.py

  - description: "Verify authentication failures are fixed"
    preconditions: "Environment contains code with secure authentication implementation"
    postconditions: "No authentication failures detected - secure password handling verified"
    function_to_run: !python/file tests/test_authentication_failures.py

  - description: "Verify data integrity failures are fixed"
    preconditions: "Environment contains code with input validation implemented"
    postconditions: "No data integrity failures detected - all input properly validated"
    function_to_run: !python/file tests/test_data_integrity_failures.py

  - description: "Verify logging failures are fixed"
    preconditions: "Environment contains code with security logging implemented"
    postconditions: "No logging failures detected - no sensitive data exposed in logs"
    function_to_run: !python/file tests/test_logging_failures.py

  - description: "Verify SSRF vulnerabilities are fixed"
    preconditions: "Environment contains code with URL validation implemented"
    postconditions: "No SSRF vulnerabilities detected - all external requests validated"
    function_to_run: !python/file tests/test_ssrf.py

  - description: "Verify HTTPOnly flag is enabled for all cookies"
    preconditions: "Environment contains DjangoGoat code with secure cookie configuration"
    postconditions: "All cookies are configured with HTTPOnly flag enabled to prevent XSS cookie theft"
    function_to_run: !python/file tests/test_cookie_httponly.py

  - description: "Verify server version information is not leaked"
    preconditions: "Environment contains DjangoGoat code with secure HTTP headers configuration"
    postconditions: "Server HTTP response header does not expose version information or is properly masked"
    function_to_run: !python/file tests/test_server_header.py

references:
  # - description: "Intentionally vulnerable Django application repository"
  #   git_url: "https://github.com/MeteoritoAlpha-Zerg/DjangoGoat"
  #   workspace_path: "djangogoat"
  #   format: "git"
  #   git_config:
  #     ref: "broken"
  #   required: true
  #   read_only: true
  - description: "Intentionally vulnerable Django application repository"
    git_url: "https://github.com/MeteoritoAlpha-Zerg/DjangoGoat"
    environment_path: "djangogoat"
    format: "git"
    git_config:
      ref: "broken"
      exclude_paths:
        # - "features"
        - "djangogoat/static"
    required: true
    read_only: false

  - description: "Interface for reading environment files"
    file_path: "tests/security_interface.py"
    environment_path: "security_interface.py"
    read_only: true
    required: true
