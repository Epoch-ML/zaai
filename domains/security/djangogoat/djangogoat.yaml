name: "djangogoat"
category: "Static Code Analysis"
description: "Fix OWASP Top 10 vulnerabilities in DjangoGoat with OWASP ZAP validation"

stages:
  - name: install system dependencies
    type: before
    description: Install Geckodriver, Firefox, OWASP ZAP
    preconditions: Package managers available
    postconditions: Geckodriver, Firefox, ZAP installed
    code_to_run: |
      import subprocess
      import platform
      import os
      import shutil
      
      _system = platform.system().lower()
      
      # Check what's already installed
      _has_geckodriver = shutil.which('geckodriver') is not None
      _has_firefox = shutil.which('firefox') is not None or os.path.exists('/Applications/Firefox.app')
      _has_zap = shutil.which('zap.sh') is not None or os.path.exists('/Applications/OWASP ZAP.app')
      
      if _system == 'darwin':
          # macOS installation
          if not _has_geckodriver:
              subprocess.run(['brew', 'install', 'geckodriver'], capture_output=True, timeout=300)
          
          if not _has_firefox:
              subprocess.run(['brew', 'install', '--cask', 'firefox'], capture_output=True, timeout=600)
          
          if not _has_zap:
              subprocess.run(['brew', 'install', '--cask', 'owasp-zap'], capture_output=True, timeout=600)
      
      elif _system == 'linux':
          # Linux installation
          if not _has_geckodriver:
              subprocess.run(['wget', 'https://github.com/mozilla/geckodriver/releases/download/v0.36.0/geckodriver-v0.36.0-linux64.tar.gz'], capture_output=True, timeout=300)
              subprocess.run(['tar', '-xzf', 'geckodriver-v0.36.0-linux64.tar.gz'], capture_output=True, timeout=60)
              subprocess.run(['sudo', 'mv', 'geckodriver', '/usr/local/bin/'], capture_output=True, timeout=60)
              subprocess.run(['rm', '-f', 'geckodriver-v0.36.0-linux64.tar.gz'], capture_output=True, timeout=10)
          
          if not _has_firefox:
              subprocess.run(['sudo', 'apt-get', 'update'], capture_output=True, timeout=300)
              subprocess.run(['sudo', 'apt-get', 'install', '-y', 'firefox'], capture_output=True, timeout=600)
          
          if not _has_zap:
              subprocess.run(['sudo', 'snap', 'install', 'zaproxy', '--classic'], capture_output=True, timeout=600)

  - name: install dependencies
    type: before
    description: Install dependencies via Poetry
    preconditions: Poetry available
    postconditions: Dependencies installed, environment cached
    code_to_run: |
      import subprocess
      import os
      import json
      from pathlib import Path
      
      # Direct code execution (agent is available in namespace)
      _env_path = Path(str(zerg.workspace.environment_path))
      _pyproject_path = _env_path / "pyproject.toml"
      
      # Fallback: search in subdirectories
      if not _pyproject_path.exists():
          for _subdir in _env_path.iterdir():
              if _subdir.is_dir():
                  _candidate = _subdir / "pyproject.toml"
                  if _candidate.exists():
                      _pyproject_path = _candidate
                      break
      
      if _pyproject_path and _pyproject_path.exists():
          _project_dir = _pyproject_path.parent
          _original_dir = os.getcwd()
          
          try:
              os.chdir(_project_dir)
              
              # Set Poetry to Python 3.10
              subprocess.run(
                  ['poetry', 'env', 'use', 'python3.10'],
                  capture_output=True,
                  timeout=30
              )
              
              # Install dependencies
              subprocess.run(
                  ['poetry', 'install'],
                  capture_output=True,
                  timeout=600
              )
              
              # Get and cache virtualenv path
              _venv_result = subprocess.run(
                  ['poetry', 'env', 'info', '--path'],
                  capture_output=True,
                  text=True,
                  timeout=10
              )
              
              if _venv_result.returncode == 0:
                  _venv_path = _venv_result.stdout.strip()
                  _workspace_root = Path(str(zerg.workspace.environment_path))
                  _cache_file = _workspace_root / ".poetry_venv_cache"
                  
                  _cache_data = {
                      'venv_path': _venv_path,
                      'python_version': '3.10',
                      'env_vars': {
                          'VIRTUAL_ENV': _venv_path,
                          'PATH': f"{_venv_path}/bin:{os.environ.get('PATH', '')}"
                      }
                  }
                  
                  _cache_file.write_text(json.dumps(_cache_data, indent=2))
                  
          finally:
              os.chdir(_original_dir)

specs:
  - description: "Fix OWASP Top 10 vulnerabilities in DjangoGoat"
    preconditions: "Codebase contains security vulnerabilities"
    postconditions: "All HIGH/MEDIUM severity vulnerabilities fixed: SQL injection, XSS, authentication bypass, cryptographic failures, SSRF, security misconfigurations"

  - description: "Edit source code in-place, create new migrations, never modify features/ folder, generate SECURITY_CHANGELOG.md"
    preconditions: "Codebase needs security fixes"
    postconditions: "Direct edits to source files, new migrations created (not modified), features/ untouched, SECURITY_CHANGELOG.md generated"

  - description: "Only edit source code and create migrations—do not add helper scripts"
    preconditions: "Required changes must be accomplished to fix the security vulnerabilities"
    postconditions: "No helper script was created to help fix the security vulnerabilities. All solutions should be done in the source code directly."

tests:
  - description: "Run complete OWASP ZAP security scan"
    preconditions: "None"
    postconditions: "Zero HIGH/MEDIUM alerts, all tests pass"
    function_to_run: !python/file tests/test_full_security_scan.py

references:
  - description: "DjangoGoat vulnerable app"
    git_url: "https://github.com/MeteoritoAlpha-Zerg/DjangoGoat"
    environment_path: "djangogoat"
    format: "git"
    git_config:
      ref: "broken"
      exclude_paths:
        - "djangogoat/static/css"
    required: true
    read_only: false

  - description: "Environment interface"
    file_path: "tests/security_interface.py"
    environment_path: "security_interface.py"
    read_only: true
    required: true

  - description: "Start server script"
    file_path: "tests/start_server.sh"
    environment_path: "start_server.sh"
    format: "sh"
    required: true
    read_only: true

  - description: "Stop server script"
    file_path: "tests/stop_server.sh"
    environment_path: "stop_server.sh"
    format: "sh"
    required: true
    read_only: true

  - description: "Run behave script"
    file_path: "tests/run_behave.sh"
    environment_path: "run_behave.sh"
    format: "sh"
    required: true
    read_only: true

  - description: "Test orchestrator script"
    file_path: "tests/run_full_test.sh"
    environment_path: "run_full_test.sh"
    format: "sh"
    required: true
    read_only: true
