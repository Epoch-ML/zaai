# Security Domain - Static Code Analysis

manifests:
  - !include pygoat-cve-poc/pygoat-cve-poc.yaml

specs:
  - description: |
      Security domain provides static code analysis for vulnerability detection and remediation
    preconditions: |
      Target codebase with known security vulnerabilities in source code
    postconditions: |
      Vulnerabilities detected through static analysis, code patterns analyzed, and security patches applied to source files

references: []

configs: 
    - name: "static_analysis_timeout"
      description: "Timeout for static analysis operations in seconds"
      value: 120

    - name: "vulnerability_detection_threshold"
      description: "Minimum percentage of vulnerabilities that must be detected through static analysis"
      value: 0.8

    - name: "code_remediation_threshold"
      description: "Minimum percentage of detected vulnerabilities that must be remediated in source code"
      value: 0.7
