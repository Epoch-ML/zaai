    enabled: true
    cacheable: true
    cache_ttl_seconds: 60
    code: |
      def measure(self, environment):
          """Count all files in the environment."""
          return len(environment.files)

  - name: "directory_count"
    description: "Count total directories in the environment"
    enabled: true
    cacheable: true
    cache_ttl_seconds: 60
    code: |
