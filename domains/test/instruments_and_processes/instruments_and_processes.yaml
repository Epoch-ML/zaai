  - name: "file_type_distribution"
    description: "Get distribution of file types in the environment"
    enabled: true
    cacheable: true
    cache_ttl_seconds: 120
    code: |
      def measure(self, environment):
          """Analyze file type distribution."""
          from collections import Counter
          from pathlib import Path
          
          extensions = []
          for file_path in environment.files.keys():
              ext = Path(file_path).suffix.lower() or '.none'
              extensions.append(ext)
          
          return dict(Counter(extensions))

  - name: "total_lines_of_code"
    description: "Count total lines of code across all source files"
    enabled: true
    cacheable: true
    cache_ttl_seconds: 300
    code: |
      def measure(self, environment):
          """Count lines of code across all source files."""
          from zerg.environment.fs.files.source.base import FSSourceFile
          
          total_lines = 0
          total_blank = 0
          total_comment = 0
          file_count = 0
          
          for file_path, file_obj in environment.files.items():
              if isinstance(file_obj, FSSourceFile):
                  file_count += 1
                  try:
                      code = file_obj.get_code()
                      lines = code.split('\n')
                      total_lines += len(lines)
                      
                      for line in lines:
                          stripped = line.strip()
                          if not stripped:
                              total_blank += 1
                          elif stripped.startswith('#') or stripped.startswith('//'):
                              total_comment += 1
                  except Exception:
                      pass
          
          return {
              'total_lines': total_lines,
              'blank_lines': total_blank,
              'comment_lines': total_comment,
              'code_lines': total_lines - total_blank - total_comment,
              'file_count': file_count
          }

  - name: "syntax_check"
    description: "Check syntax validity of all source files"
    enabled: true
    cacheable: false
    code: |
      def measure(self, environment):
          """Check syntax of all source files."""
          from zerg.environment.fs.files.source.base import FSSourceFile
          
          results = {
              'total_files': 0,
              'valid_files': 0,
              'invalid_files': 0,
              'errors': []
          }
          
          for file_path, file_obj in environment.files.items():
              if isinstance(file_obj, FSSourceFile):
                  results['total_files'] += 1
                  try:
                      validation = file_obj.validate_syntax()
                      if validation.get('valid', False):
                          results['valid_files'] += 1
                      else:
                          results['invalid_files'] += 1
                          results['errors'].append({
                              'file': file_path,
                              'errors': validation.get('errors', [])
                          })
                  except Exception as e:
                      results['invalid_files'] += 1
                      results['errors'].append({
                          'file': file_path,
                          'errors': [{'message': str(e)}]
                      })
          
          return results

  - name: "environment_health"
    description: "Comprehensive health check of the environment"
    enabled: true
    cacheable: true
    cache_ttl_seconds: 60
    code: |
      def measure(self, environment):
          """Perform comprehensive health check."""
          file_count = len(environment.files)
          dir_count = len(environment.directories)
          
          issues = []
          warnings = []
          
          if file_count == 0:
              issues.append("No files in environment")
          elif file_count > 500:
              warnings.append(f"Large file count: {file_count}")
          
          # Check for syntax errors in source files
          from zerg.environment.fs.files.source.base import FSSourceFile
          syntax_errors = 0
          for file_obj in environment.files.values():
              if isinstance(file_obj, FSSourceFile):
                  try:
                      if not file_obj.validate_syntax().get('valid', True):
                          syntax_errors += 1
                  except:
                      pass
          
          if syntax_errors > 0:
              issues.append(f"{syntax_errors} files with syntax errors")
          
          if issues:
              status = 'critical'
          elif warnings:
              status = 'warning'
          else:
              status = 'healthy'
          
          return {
              'status': status,
              'file_count': file_count,
              'directory_count': dir_count,
              'syntax_errors': syntax_errors,
              'issues': issues,
              'warnings': warnings
          }

  - name: "test_coverage_estimate"
    description: "Estimate test coverage based on test file presence"
    enabled: true
    cacheable: true
    cache_ttl_seconds: 300
    code: |
      def measure(self, environment):
          """Estimate test coverage by analyzing test files."""
          from pathlib import Path
          
          source_files = set()
          test_files = set()
          
          for file_path in environment.files.keys():
              path = Path(file_path)
              if '_test.py' in file_path or 'test_' in path.name:
                  test_files.add(file_path)
              elif file_path.endswith('.py'):
                  source_files.add(file_path)
          
          coverage = (len(test_files) / len(source_files) * 100) if source_files else 0
          
          return {
              'source_files': len(source_files),
              'test_files': len(test_files),
              'coverage_percentage': round(coverage, 2)
          }

  - name: "spec_completion"
    description: "Measure specification completion status"
    enabled: true
    cacheable: true
    cache_ttl_seconds: 60
    code: |
      def measure(self, environment):
          """Analyze spec completion status."""
          specs = getattr(environment, 'specs', [])
          total_specs = len(specs)
          
          if total_specs == 0:
              return {'total_specs': 0, 'enabled_specs': 0, 'completion_percentage': 0}
          
          enabled = sum(1 for s in specs if getattr(s, 'enabled', True))
          
          return {
              'total_specs': total_specs,
              'enabled_specs': enabled,
              'completion_percentage': round(enabled / total_specs * 100, 2)
          }

# PROCESSES - State-modifying operations
processes:
  - name: "cleanup_empty_directories"
    description: "Remove empty directories from the environment"
    code: |
      def execute(self, environment, config=None):
          """Remove empty directories."""
          import shutil
          
          removed = []
          errors = []
          
          # Sort directories by depth (deepest first)
          sorted_dirs = sorted(
              environment.directories.keys(),
              key=lambda x: x.count('/'),
              reverse=True
          )
          
          for dir_path in sorted_dirs:
              if dir_path == '.':
                  continue
              
              dir_obj = environment.directories.get(dir_path)
              if not dir_obj:
                  continue
              
              # Check if directory is empty
              has_files = any(
                  f.startswith(dir_path + '/') for f in environment.files.keys()
              )
              has_subdirs = any(
                  d.startswith(dir_path + '/') and d != dir_path
                  for d in environment.directories.keys()
                  if d not in removed
              )
              
              if not has_files and not has_subdirs:
                  try:
                      if dir_obj.abs_path.exists():
                          shutil.rmtree(dir_obj.abs_path)
                      del environment.directories[dir_path]
                      removed.append(dir_path)
                  except Exception as e:
                      errors.append({'path': dir_path, 'error': str(e)})
          
          return {
              'removed_count': len(removed),
              'removed': removed,
              'errors': errors
          }

  - name: "normalize_file_extensions"
    description: "Standardize file extensions to lowercase"
    code: |
      def execute(self, environment, config=None):
          """Normalize file extensions to lowercase."""
          import shutil
          from pathlib import Path
          
          renamed = []
          errors = []
          
          files_to_rename = []
          for file_path in list(environment.files.keys()):
              path = Path(file_path)
              ext = path.suffix
              if ext != ext.lower() and ext:
                  new_name = str(path.with_suffix(ext.lower()))
                  files_to_rename.append((file_path, new_name))
          
          for old_path, new_path in files_to_rename:
              try:
                  file_obj = environment.files[old_path]
                  old_abs = file_obj.abs_path
                  new_abs = old_abs.with_suffix(Path(old_path).suffix.lower())
                  
                  shutil.move(str(old_abs), str(new_abs))
                  
                  file_obj.abs_path = new_abs
                  file_obj.rel_path = new_path
                  del environment.files[old_path]
                  environment.files[new_path] = file_obj
                  
                  renamed.append({'from': old_path, 'to': new_path})
              except Exception as e:
                  errors.append({'path': old_path, 'error': str(e)})
          
          return {
              'renamed_count': len(renamed),
              'renamed': renamed,
              'errors': errors
          }

  - name: "format_python_files"
    description: "Format Python files using black"
    code: |
      def execute(self, environment, config=None):
          """Format Python files."""
          from zerg.environment.fs.files.source.python import FSPythonFile
          
          formatted = []
          skipped = []
          errors = []
          
          for file_path, file_obj in environment.files.items():
              if isinstance(file_obj, FSPythonFile):
                  if file_obj.read_only:
                      skipped.append({'path': file_path, 'reason': 'read_only'})
                      continue
                  
                  try:
                      original = file_obj.get_code()
                      result = file_obj.format_code()
                      
                      if result:
                          new_code = file_obj.get_code()
                          changed = original != new_code
                          formatted.append({'path': file_path, 'changed': changed})
                      else:
                          skipped.append({'path': file_path, 'reason': 'format_failed'})
                  except Exception as e:
                      errors.append({'path': file_path, 'error': str(e)})
          
          return {
              'formatted_count': len(formatted),
              'formatted': formatted,
              'skipped': skipped,
              'errors': errors
          }

  - name: "sync_from_filesystem"
    description: "Sync environment with actual filesystem state"
    code: |
      def execute(self, environment, config=None):
          """Sync the environment with the filesystem."""
          detect_changes = config.get('detect_changes', True) if config else True
          
          changes = environment.sync_from_filesystem(detect_changes=detect_changes)
          
          return {
              'added': changes.get('added', []),
              'modified': changes.get('modified', []),
              'deleted': changes.get('deleted', []),
              'added_count': len(changes.get('added', [])),
              'modified_count': len(changes.get('modified', [])),
              'deleted_count': len(changes.get('deleted', []))
          }

  - name: "cleanup_temp_files"
    description: "Remove temporary and cache files"
    code: |
      def execute(self, environment, config=None):
          """Remove temporary files matching common patterns."""
          import fnmatch
          from pathlib import Path
          
          patterns = config.get('patterns', [
              '*.pyc', '__pycache__', '*.pyo', '.pytest_cache',
              '*.egg-info', '.mypy_cache', '*.log', '*.tmp'
          ]) if config else ['*.pyc', '__pycache__', '*.pyo', '*.tmp']
          
          to_remove = []
          for file_path in list(environment.files.keys()):
              for pattern in patterns:
                  if fnmatch.fnmatch(file_path, pattern) or fnmatch.fnmatch(Path(file_path).name, pattern):
                      to_remove.append(file_path)
                      break
          
          removed = []
          errors = []
          
          for file_path in to_remove:
              try:
                  file_obj = environment.files[file_path]
                  if hasattr(file_obj, 'abs_path') and file_obj.abs_path.exists():
                      file_obj.abs_path.unlink()
                  del environment.files[file_path]
                  removed.append(file_path)
              except Exception as e:
                  errors.append({'path': file_path, 'error': str(e)})
          
          return {
              'removed_count': len(removed),
              'removed': removed,
              'errors': errors
          }