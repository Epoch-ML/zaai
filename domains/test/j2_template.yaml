# Jinja2 Template Demo
name: "j2_template"
category: "Template Processing"
description: |
  Demonstrates the use of Jinja2 templates within the manifest system.
  This connector showcases different ways to use the !python/template directive
  including inline context, context from YAML sections, and dynamic context extraction.

specs:
  - description: "Template loader correctly processes simple template files"
    preconditions: "Template files exist in the workspace"
    postconditions: "Templates are loaded and rendered with provided context"
  
  - description: "Templates can access configuration data from the manifest"
    preconditions: "Manifest contains configs section with values"
    postconditions: "Rendered templates include configuration values"
  
  - description: "Templates support dynamic context extraction"
    preconditions: "Context extractor function is provided"
    postconditions: "Templates receive dynamically generated context based on manifest data"
  
  - description: "Templates can generate Python code that executes correctly"
    preconditions: "Code generation templates are loaded"
    postconditions: "Generated Python code is syntactically correct and executable"
  
  - description: "Template results can be saved to output files"
    preconditions: "Output path is specified in template configuration"
    postconditions: "Rendered content is saved to the specified output path"

tests:
