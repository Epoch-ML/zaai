# Jinja2 Template Demo with All Directives
name: "j2_template"
category: "Template Processing"
description: |
  Demonstrates the use of Jinja2 templates within the manifest system.
  This manifest showcases all available YAML directives (!time/*, !uuid, !random, !list, !dict, !ref, !join, etc.)
  and how they can be used in templates for dynamic test generation.

specs:
  - description: "Template loader correctly processes simple template files"
    preconditions: "Template files exist in the workspace"
    postconditions: "Templates are loaded and rendered with provided context"
  
  - description: "Templates can access configuration data from the manifest"
    preconditions: "Manifest contains configs section with values"
    postconditions: "Rendered templates include configuration values"
  
  - description: "All YAML directives generate appropriate values"
    preconditions: "Directives are properly registered in the loader"
    postconditions: "Generated values are accessible in templates"

tests:
  - description: "Test Simple Template Rendering with All Directives"
    preconditions: "Template file exists at templates/simple.j2"
    postconditions: "Template renders with all directive-generated values"
    function_to_run: !python/template templates/simple.j2

references: []

configs:
  # Basic configuration values
  - name: "report_title"
    description: "A report title"
    value: "Directive Showcase Report"

  - name: "user_name"
    description: "A username"
    value: "test_user"

  - name: "custom_message"
    description: "A custom message to include"
    value: "Testing all YAML directives!"

  # Time-related directives
  - name: "timestamp_iso"
    description: "Current timestamp in ISO format"
    value: !time/now iso

  - name: "timestamp_unix"
    description: "Current timestamp as Unix epoch"
    value: !time/now unix

  - name: "timestamp_date"
    description: "Current date only"
    value: !time/now date

  - name: "timestamp_datetime"
    description: "Current datetime in readable format"
    value: !time/now datetime

  - name: "timestamp_custom"
    description: "Custom formatted timestamp"
    value: !time/now custom:%Y-%m-%d_%H-%M-%S

  - name: "today"
    description: "Today's date"
    value: !time/today

  - name: "tomorrow"
    description: "Tomorrow's date"
    value: !time/offset +1d

  - name: "last_week"
    description: "Date from last week"
    value: !time/offset -7d

  - name: "in_two_hours"
    description: "Time in 2 hours"
    value: !time/offset +2h

  # UUID directives
  - name: "session_id"
    description: "Full UUID v4 for session"
    value: !uuid uuid4

  - name: "trace_id"
    description: "UUID v1 for tracing"
    value: !uuid uuid1

  - name: "short_id"
    description: "Short 8-char UUID"
    value: !uuid short

  # Random value directives
  - name: "random_port"
    description: "Random port number"
    value: !random port

  - name: "random_int"
    description: "Random integer between 1 and 100"
    value: !random int:1:100

  - name: "random_float"
    description: "Random float between 0 and 1"
    value: !random float:0:1

  - name: "random_choice"
    description: "Random environment selection"
    value: !random choice:development,staging,production

  - name: "random_string"
    description: "Random 12-character alphanumeric string"
    value: !random string:12

  - name: "random_hex"
    description: "Random 16-character hex string"
    value: !random hex:16

  # Security-related directives
  - name: "api_key"
    description: "Generated API key"
    value: !secret api_key

  - name: "auth_token"
    description: "32-byte authentication token"
    value: !secret token:32

  - name: "temp_password"
    description: "Temporary 16-character password"
    value: !secret password:16

  # Hash directives
  - name: "config_hash_md5"
    description: "MD5 hash of configuration"
    value: !hash md5:j2_template_config_v1

  - name: "config_hash_sha256"
    description: "SHA256 hash of configuration"
    value: !hash sha256:j2_template_config_v1

  - name: "config_hash_sha1"
    description: "SHA1 hash of configuration"
    value: !hash sha1:j2_template_config_v1

  # Base64 encoding
  - name: "encoded_message"
    description: "Base64 encoded message"
    value: !base64 Hello, Template World!

  - name: "encoded_config"
    description: "Base64 encoded configuration string"
    value: !base64 encode:config=production&debug=false

  # Evaluation directive (use with caution)
  - name: "calculated_value"
    description: "Simple calculated value"
    value: !eval "2 ** 8"

  - name: "string_length"
    description: "Length of a string"
    value: !eval "len('template_testing')"

  - name: "joined_string"
    description: "Joined string from list"
    value: !eval "'-'.join(['test', 'template', 'v1'])"

  # Environment variables (optional - will use defaults if not set)
  - name: "env_home"
    description: "Home directory from environment"
    value: !env/var HOME

  - name: "env_user"
    description: "Current user from environment"
    value: !env/var USER

  # List directive tests
  - name: "server_list"
    description: "List of servers using inline format"
    value: !list [server1, server2, server3]

  - name: "port_list"
    description: "List of ports from comma-separated string"
    value: !list 8080,8081,8082,8083

  - name: "single_item_list"
    description: "Single item becomes a list"
    value: !list production

  - name: "empty_list"
    description: "Empty list"
    value: !list

  # Dict directive tests
  - name: "server_config"
    description: "Dictionary using inline format"
    value: !dict {host: localhost, port: 8080, ssl: true}

  - name: "json_config"
    description: "Dictionary from JSON format"
    value: !dict json:{"environment":"production","debug":false,"timeout":30}

  - name: "pairs_config"
    description: "Dictionary from key=value pairs"
    value: !dict pairs:user=admin,password=secret,role=superuser

  - name: "empty_dict"
    description: "Empty dictionary"
    value: !dict

  # Ref directive tests - define base values first
  - name: "base_url"
    description: "Base URL for API"
    value: "https://api.example.com"

  - name: "api_version"
    description: "API version"
    value: "v2"

  - name: "referenced_base_url"
    description: "Reference to base_url config"
    value: !ref base_url

  - name: "referenced_user"
    description: "Reference to user_name config"
    value: !ref user_name

  - name: "referenced_port"
    description: "Reference to random_port config"
    value: !ref random_port

  # Metadata
  - name: "log_level"
    description: "Logging level"
    value: "INFO"

  - name: "test_environment"
    description: "Test environment name"
    value: "integration"

  - name: "version"
    description: "Configuration version"
    value: "1.0.0"