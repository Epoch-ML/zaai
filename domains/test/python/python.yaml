name: "python"
category: "Python Environment"
description: |
  A comprehensive data analytics platform with multiple interconnected modules
  for data ingestion, processing, analysis, and visualization. Demonstrates
  proper module structure with cross-references and imports.

specs: []
tests: []

references:
  # The code
  - description: "Python environment"
    file_path: "src/**/*.py"
    environment_path: "src"
    format: "glob"
    required: true
    read_only: true

configs: 
  - name: "default_config"
    description: "Default platform configuration"
    value:
      platform:
        name: "Analytics Platform"
        version: "1.0.0"
      processing:
        max_workers: 4
        batch_size: 1000
        cache_enabled: true
      visualization:
        default_theme: "modern"
        export_formats: ["pdf", "html", "png"]
        
  - name: "project_structure"
    description: "project structure"
    value: 
      modules:
        - name: "core"
          description: "Core functionality and base classes"
          files:
            - "base.py"
            - "exceptions.py"
            - "validators.py"
            - "config.py"
            - "registry.py"
        
        - name: "ingestion"
          description: "Data ingestion and source management"
          files:
            - "sources.py"
            - "connectors.py"
            - "parsers.py"
            - "schema.py"
            - "loader.py"
        
        - name: "processing"
          description: "Data processing and transformation"
          files:
            - "processor.py"
            - "transformers.py"
            - "aggregators.py"
            - "pipeline.py"
            - "cache.py"
        
        - name: "visualization"
          description: "Data visualization and reporting"
          files:
            - "charts.py"
            - "reports.py"
            - "exporters.py"
            - "templates.py"

  - name: "dependencies"
    description: "module dependencies"
    value: [
      "numpy",
      "pandas",
      "pydantic",
      "typing_extensions"
    ]