  # - name: initialize platform
  #   type: before
  #   description: Initializes the analytics platform with test configuration
  #   preconditions: Test data staged successfully
  #   postconditions: Platform is initialized and ready for testing
  #   code_to_run: !javascript/file stages/3-initialize-platform.js

specs: []
tests: 
  - description: |
      Test Core module base class functionality
    preconditions: |
      Core module is available and can be imported
    postconditions: |
      BaseComponent can be instantiated;
      Component registry tracks all registered components;
      Validators correctly validate input data;
      Configuration manager loads and merges configs;
    function_to_run: !js/file tests/1-test-core-module.js

  # - description: |
  #     Test Data Ingestion from CSV files
  #   preconditions: |
  #     Test CSV fixtures are staged;
  #     Ingestion module is available;
  #   postconditions: |
  #     CSV parser correctly parses sample-data.csv;
  #     Schema detection identifies column types;
  #     All 5 records are loaded with correct values;
  #     Data types are correctly inferred (number, string, date);
  #   function_to_run: !javascript/file tests/2-test-csv-ingestion.js

references: []
  # # The code
  # - description: "javascript environment"
  #   file_path: "src/**/*.*"
  #   environment_path: "src"
  #   format: "glob"
  #   required: true
  #   read_only: true

configs: 
  - name: "default_config"
    description: "Default platform configuration"
    value:
      platform:
        name: "Analytics Platform JS"
        version: "1.0.0"
      processing:
        maxWorkers: 4
        batchSize: 1000
        cacheEnabled: true
      visualization:
        defaultTheme: "modern"
        exportFormats: ["pdf", "html", "png"]
        
  - name: "project_structure"
    description: "project structure"
    value: 
      modules:
        - name: "core"
          description: "Core functionality and base classes"
          files:
            - "base.js"
            - "exceptions.js"
            - "validators.js"
            - "config.js"
            - "registry.js"
        
        - name: "ingestion"
          description: "Data ingestion and source management"
          files:
            - "sources.js"
            - "connectors.js"
            - "parsers.js"
            - "schema.js"
            - "loader.js"
        
        - name: "processing"
          description: "Data processing and transformation"
          files:
            - "processor.js"
            - "transformers.js"
            - "aggregators.js"
            - "pipeline.js"
            - "cache.js"
        
        - name: "visualization"
          description: "Data visualization and reporting"
          files:
            - "charts.js"
            - "reports.js"
            - "exporters.js"
            - "templates.js"

  - name: "dependencies"
    description: "NPM dependencies"
    value:
      dependencies:
        - "express"
        - "lodash"
        - "axios"
        - "csv-parser"
        - "xml2js"
      devDependencies:
        - "jest"
        - "nodemon"
        - "eslint"