name: "workflows"
category: "Workflow System Test"
description: |
  A comprehensive test suite for the workflow execution system. Demonstrates
  inline phases, external phase files, custom error handlers, conditional
  branching, graph composition, and integration with built-in phases.
  
  This project simulates a data processing pipeline with validation,
  transformation, analysis, and reporting stages.

specs: []
tests: []

configs:
  - name: "pipeline_config"
    description: "Data pipeline configuration"
    value:
      pipeline:
        name: "Test Data Pipeline"
        version: "1.0.0"
        strict_mode: false
      validation:
        required_fields: ["id", "timestamp", "value"]
        max_null_ratio: 0.1
        type_coercion: true
      transformation:
        normalize: true
        fill_nulls: "mean"
        outlier_method: "zscore"
        outlier_threshold: 3.0
      analysis:
        aggregations: ["sum", "mean", "std", "min", "max"]
        group_by: ["category", "region"]
      reporting:
        format: "json"
        include_metadata: true
        timestamp_format: "iso"

  - name: "test_datasets"
    description: "Test data configurations"
    value:
      small:
        records: 100
        error_rate: 0.0
        null_rate: 0.05
      medium:
        records: 1000
        error_rate: 0.01
        null_rate: 0.1

  - name: "error_scenarios"
    description: "Error injection for testing"
    value:
      - name: "transient_failure"
        phase: "DataFetch"
        probability: 0.3
        max_failures: 2

# WORKFLOW DEFINITIONS
workflows:
  phases:
    # =========================================================================
    # HELLO WORLD PHASES - Simple phases for testing/benchmarking
    # =========================================================================
    
    - name: "HelloStart"
      description: "Simple start phase - initializes a counter"
      max_retries: 1
      code: |
        def forward(self, *inputs):
            """Initialize with a simple greeting and counter."""
            input_data = inputs[0].data if inputs else {}
            
            name = input_data.get('name', 'World')
            start_value = input_data.get('start_value', 0)
            
            L.info(f"Hello, {name}! Starting with value: {start_value}")
            
            return ExecutionTensor(
                data={
                    'greeting': f'Hello, {name}!',
                    'counter': start_value,
                    'history': [f'start: {start_value}'],
                },
                status=PhaseStatus.COMPLETED
            )

    - name: "AddOne"
      description: "Add 1 to the counter"
      max_retries: 1
      code: |
        def forward(self, *inputs):
            """Increment counter by 1."""
            input_data = inputs[0].data if inputs else {}
            
            counter = input_data.get('counter', 0) + 1
            history = input_data.get('history', [])
            history.append(f'add_one: {counter}')
            
            L.info(f"AddOne: counter is now {counter}")
            
            return ExecutionTensor(
                data={**input_data, 'counter': counter, 'history': history},
                status=PhaseStatus.COMPLETED
            )

    - name: "Double"
      description: "Double the counter value"
      max_retries: 1
      code: |
        def forward(self, *inputs):
            """Double the counter value."""
            input_data = inputs[0].data if inputs else {}
            
            counter = input_data.get('counter', 0) * 2
            history = input_data.get('history', [])
            history.append(f'double: {counter}')
            
            L.info(f"Double: counter is now {counter}")
            
            return ExecutionTensor(
                data={**input_data, 'counter': counter, 'history': history},
                status=PhaseStatus.COMPLETED
            )

    - name: "Square"
      description: "Square the counter value"
      max_retries: 1
      code: |
        def forward(self, *inputs):
            """Square the counter value."""
            input_data = inputs[0].data if inputs else {}
            
            counter = input_data.get('counter', 0) ** 2
            history = input_data.get('history', [])
            history.append(f'square: {counter}')
            
            L.info(f"Square: counter is now {counter}")
            
            return ExecutionTensor(
                data={**input_data, 'counter': counter, 'history': history},
                status=PhaseStatus.COMPLETED
            )

    - name: "PrintResult"
      description: "Print the final result"
      max_retries: 1
      code: |
        def forward(self, *inputs):
            """Print final result and summary."""
            input_data = inputs[0].data if inputs else {}
            
            greeting = input_data.get('greeting', 'Hello!')
            counter = input_data.get('counter', 0)
            history = input_data.get('history', [])
            
            result = {
                'greeting': greeting,
                'final_value': counter,
                'operations': history,
                'operation_count': len(history),
            }
            
            L.info(f"=== RESULT ===")
            L.info(f"  {greeting}")
            L.info(f"  Final value: {counter}")
            L.info(f"  Operations: {' -> '.join(history)}")
            
            return ExecutionTensor(
                data={**input_data, 'result': result},
                status=PhaseStatus.COMPLETED
            )

    - name: "CheckThreshold"
      description: "Check if counter exceeds threshold (for conditional testing)"
      max_retries: 1
      code: |
        def forward(self, *inputs):
            """Check counter against threshold and set routing flags."""
            input_data = inputs[0].data if inputs else {}
            
            counter = input_data.get('counter', 0)
            threshold = input_data.get('threshold', 10)
            
            exceeds = counter > threshold
            
            L.info(f"CheckThreshold: {counter} {'>' if exceeds else '<='} {threshold}")
            
            return ExecutionTensor(
                data={
                    **input_data,
                    'exceeds_threshold': exceeds,
                    'threshold_check': {
                        'value': counter,
                        'threshold': threshold,
                        'exceeds': exceeds,
                    }
                },
                status=PhaseStatus.COMPLETED
            )

    - name: "LogHigh"
      description: "Log message for high values"
      max_retries: 1
      code: |
        def forward(self, *inputs):
            """Log that value is high."""
            input_data = inputs[0].data if inputs else {}
            counter = input_data.get('counter', 0)
            
            message = f"HIGH VALUE ALERT: {counter}"
            L.warning(message)
            
            history = input_data.get('history', [])
            history.append(f'high_alert: {counter}')
            
            return ExecutionTensor(
                data={**input_data, 'alert': message, 'history': history},
                status=PhaseStatus.COMPLETED
            )

    - name: "LogLow"
      description: "Log message for low values"
      max_retries: 1
      code: |
        def forward(self, *inputs):
            """Log that value is low/normal."""
            input_data = inputs[0].data if inputs else {}
            counter = input_data.get('counter', 0)
            
            message = f"Value is normal: {counter}"
            L.info(message)
            
            history = input_data.get('history', [])
            history.append(f'normal: {counter}')
            
            return ExecutionTensor(
                data={**input_data, 'status': message, 'history': history},
                status=PhaseStatus.COMPLETED
            )

    # =========================================================================
    # COMPLEX PIPELINE PHASES (existing)
    # =========================================================================
    
    - name: "Initialize"
      description: "Initialize pipeline context and configuration"
      max_retries: 1
      code: |
        def forward(self, *inputs):
            """Set up initial pipeline state."""
            input_data = inputs[0].data if inputs else {}
            
            context = {
                'pipeline_id': input_data.get('pipeline_id', 'test-001'),
                'started_at': input_data.get('timestamp', '2024-01-01T00:00:00Z'),
                'config': input_data.get('config', {}),
                'metrics': {
                    'phases_completed': 0,
                    'records_processed': 0,
                    'errors_encountered': 0,
                },
                'stage': 'initialized',
            }
            
            L.info(f"Pipeline {context['pipeline_id']} initialized")
            
            return ExecutionTensor(
                data={'context': context, **input_data},
                status=PhaseStatus.COMPLETED
            )

    - name: "DataFetch"
      description: "Fetch data from configured source (simulated)"
      max_retries: 3
      retry_delay: 1.0
      default_error_action: "retry"
      code: |
        def forward(self, *inputs):
            """Simulate fetching data from an external source."""
            import random
            
            input_data = inputs[0].data if inputs else {}
            context = input_data.get('context', {})
            
            if context.get('inject_fetch_error') and random.random() < 0.5:
                raise ConnectionError("Simulated: Failed to connect to data source")
            
            dataset_config = input_data.get('dataset', {'records': 100})
            num_records = dataset_config.get('records', 100)
            
            records = []
            for i in range(num_records):
                records.append({
                    'id': f'record-{i:05d}',
                    'timestamp': f'2024-01-{(i % 28) + 1:02d}T{i % 24:02d}:00:00Z',
                    'value': random.uniform(0, 1000),
                    'category': random.choice(['A', 'B', 'C', 'D']),
                    'region': random.choice(['north', 'south', 'east', 'west']),
                    'is_valid': random.random() > dataset_config.get('null_rate', 0.1),
                })
            
            context['stage'] = 'data_fetched'
            context['metrics']['records_processed'] = len(records)
            
            L.info(f"Fetched {len(records)} records")
            
            return ExecutionTensor(
                data={'context': context, 'records': records, **input_data},
                status=PhaseStatus.COMPLETED
            )
      
      on_error: |
        def on_error(self, error, input_tensor, attempt):
            """Retry on connection errors with exponential backoff."""
            error_str = str(error).lower()
            
            if 'connection' in error_str or 'timeout' in error_str:
                delay = min(2 ** attempt, 30)
                L.warning(f"DataFetch attempt {attempt} failed, retrying in {delay}s")
                return ErrorHandlerResult(
                    action=ErrorAction.RETRY,
                    retry_delay=delay,
                    should_log=True,
                    error_message=f"Transient error, attempt {attempt}"
                )
            
            return ErrorHandlerResult(
                action=ErrorAction.FAIL,
                error_message=f"Non-recoverable error: {error}"
            )

    - name: "DataValidation"
      description: "Validate fetched data against schema"
      max_retries: 2
      code: |
        def forward(self, *inputs):
            """Validate records and separate valid/invalid."""
            input_data = inputs[0].data if inputs else {}
            records = input_data.get('records', [])
            
            valid_records = []
            invalid_records = []
            
            for record in records:
                if record.get('is_valid', True) and record.get('value') is not None:
                    valid_records.append(record)
                else:
                    invalid_records.append(record)
            
            L.info(f"Validation: {len(valid_records)} valid, {len(invalid_records)} invalid")
            
            return ExecutionTensor(
                data={
                    **input_data,
                    'valid_records': valid_records,
                    'invalid_records': invalid_records,
                    'valid_count': len(valid_records),
                    'invalid_count': len(invalid_records),
                },
                status=PhaseStatus.COMPLETED
            )

    - name: "DataTransform"
      description: "Transform and normalize data"
      max_retries: 2
      retry_delay: 0.5
      code: |
        def forward(self, *inputs):
            """Transform valid records."""
            input_data = inputs[0].data if inputs else {}
            valid_records = input_data.get('valid_records', [])
            
            # Simple transformation: normalize values
            if valid_records:
                values = [r.get('value', 0) for r in valid_records]
                max_val = max(values) if values else 1
                
                for record in valid_records:
                    record['normalized_value'] = record.get('value', 0) / max_val
            
            L.info(f"Transformed {len(valid_records)} records")
            
            return ExecutionTensor(
                data={**input_data, 'valid_records': valid_records, 'transformed': True},
                status=PhaseStatus.COMPLETED
            )

    - name: "DataAnalysis"
      description: "Perform analysis and aggregations"
      max_retries: 1
      code: |
        def forward(self, *inputs):
            """Compute basic statistics."""
            input_data = inputs[0].data if inputs else {}
            valid_records = input_data.get('valid_records', [])
            
            values = [r.get('value', 0) for r in valid_records]
            
            analysis = {
                'count': len(values),
                'sum': sum(values) if values else 0,
                'mean': sum(values) / len(values) if values else 0,
                'min': min(values) if values else 0,
                'max': max(values) if values else 0,
            }
            
            L.info(f"Analysis complete: mean={analysis['mean']:.2f}")
            
            return ExecutionTensor(
                data={**input_data, 'analysis': analysis},
                status=PhaseStatus.COMPLETED
            )

    - name: "ReportGeneration"
      description: "Generate final report"
      max_retries: 2
      default_error_action: "continue"
      code: |
        def forward(self, *inputs):
            """Generate a summary report."""
            input_data = inputs[0].data if inputs else {}
            context = input_data.get('context', {})
            analysis = input_data.get('analysis', {})
            
            report = {
                'pipeline_id': context.get('pipeline_id'),
                'status': 'completed',
                'metrics': context.get('metrics', {}),
                'summary': {
                    'total_records': context.get('metrics', {}).get('records_processed', 0),
                    'valid_records': input_data.get('valid_count', 0),
                    'invalid_records': input_data.get('invalid_count', 0),
                    'analysis': analysis,
                },
            }
            
            L.info(f"Report generated for pipeline {report['pipeline_id']}")
            
            return ExecutionTensor(
                data={'context': context, 'report': report, **input_data},
                status=PhaseStatus.COMPLETED
            )

    - name: "Cleanup"
      description: "Cleanup temporary resources"
      max_retries: 1
      code: |
        def forward(self, *inputs):
            """Clean up resources."""
            input_data = inputs[0].data if inputs else {}
            context = input_data.get('context', {})
            
            context['stage'] = 'completed'
            L.info("Pipeline cleanup completed")
            
            return ExecutionTensor(
                data={'context': context, 'cleanup': True, **input_data},
                status=PhaseStatus.COMPLETED
            )

    - name: "QualityCheck"
      description: "Check data quality and decide next steps"
      max_retries: 1
      code: |
        def forward(self, *inputs):
            """Evaluate data quality and set routing flags."""
            input_data = inputs[0].data if inputs else {}
            
            valid_count = input_data.get('valid_count', 0)
            total_count = input_data.get('context', {}).get('metrics', {}).get('records_processed', 1)
            
            quality_ratio = valid_count / max(total_count, 1)
            
            routing = {
                'needs_reprocessing': quality_ratio < 0.8,
                'can_analyze': quality_ratio >= 0.5,
                'should_alert': quality_ratio < 0.5,
                'quality_score': quality_ratio,
            }
            
            L.info(f"Data quality: {quality_ratio:.1%}")
            
            return ExecutionTensor(
                data={**input_data, 'routing': routing},
                status=PhaseStatus.COMPLETED
            )

    - name: "AlertHandler"
      description: "Handle quality alerts"
      max_retries: 1
      code: |
        def forward(self, *inputs):
            """Send alerts for poor quality data."""
            input_data = inputs[0].data if inputs else {}
            quality_score = input_data.get('routing', {}).get('quality_score', 1.0)
            
            alert = {
                'type': 'data_quality_warning',
                'severity': 'high' if quality_score < 0.3 else 'medium',
                'message': f'Data quality below threshold: {quality_score:.1%}',
            }
            
            L.warning(f"Alert: {alert['message']}")
            warnings = input_data.get('warnings', [])
            warnings.append(alert)
            
            return ExecutionTensor(
                data={**input_data, 'warnings': warnings, 'alert_sent': True},
                status=PhaseStatus.COMPLETED
            )

    - name: "Reprocess"
      description: "Attempt to recover bad records"
      max_retries: 2
      code: |
        def forward(self, *inputs):
            """Try to recover invalid records."""
            input_data = inputs[0].data if inputs else {}
            
            invalid_records = input_data.get('invalid_records', [])
            recovered = []
            still_invalid = []
            
            for record in invalid_records:
                if record.get('value') is None:
                    record['value'] = 0
                    record['recovered'] = True
                    recovered.append(record)
                else:
                    still_invalid.append(record)
            
            valid_records = input_data.get('valid_records', [])
            valid_records.extend(recovered)
            
            L.info(f"Recovered {len(recovered)} records")
            
            return ExecutionTensor(
                data={
                    **input_data,
                    'valid_records': valid_records,
                    'invalid_records': still_invalid,
                    'valid_count': len(valid_records),
                    'invalid_count': len(still_invalid),
                },
                status=PhaseStatus.COMPLETED
            )

  # GRAPH DEFINITIONS
  graphs:
    # =========================================================================
    # HELLO WORLD GRAPHS - Simple graphs for testing/benchmarking
    # =========================================================================
    
    # Simplest possible graph - just start and print
    - name: "HelloWorld"
      description: "Simplest possible workflow - just says hello"
      entry_phase: "HelloStart"
      handle_errors: true
      max_attempts: 1
      flow: "HelloStart >> PrintResult"

    # Simple linear math: start(5) -> +1 -> *2 -> print = 12
    - name: "SimpleMath"
      description: "Simple linear math operations: (start + 1) * 2"
      entry_phase: "HelloStart"
      handle_errors: true
      max_attempts: 1
      flow: "HelloStart >> AddOne >> Double >> PrintResult"

    # More complex math: start(3) -> +1 -> square -> *2 -> print = 32
    - name: "MathChain"
      description: "Chained math: ((start + 1) ^ 2) * 2"
      entry_phase: "HelloStart"
      handle_errors: true
      max_attempts: 1
      flow: "HelloStart >> AddOne >> Square >> Double >> PrintResult"

    # Conditional branching based on threshold
    - name: "ConditionalHello"
      description: "Conditional branching - different paths based on value"
      entry_phase: "HelloStart"
      handle_errors: true
      max_attempts: 1
      connections:
        - from: "HelloStart"
          to: "AddOne"
        - from: "AddOne"
          to: "Square"
        - from: "Square"
          to: "CheckThreshold"
        # Branch based on threshold
        - from: "CheckThreshold"
          to: "LogHigh"
          condition: "data.get('exceeds_threshold', False)"
        - from: "CheckThreshold"
          to: "LogLow"
          condition: "not data.get('exceeds_threshold', True)"
        # Both paths converge to PrintResult
        - from: "LogHigh"
          to: "PrintResult"
        - from: "LogLow"
          to: "PrintResult"

    # =========================================================================
    # COMPLEX PIPELINE GRAPHS (existing)
    # =========================================================================
    
    # Simple linear pipeline
    - name: "SimplePipeline"
      description: "Basic linear data processing pipeline"
      entry_phase: "Initialize"
      handle_errors: true
      max_attempts: 3
      flow: "Initialize >> DataFetch >> DataValidation >> DataTransform >> ReportGeneration >> Cleanup"

    # Pipeline with quality checks and conditional branching
    - name: "QualityAwarePipeline"
      description: "Pipeline with quality checks and conditional branching"
      entry_phase: "Initialize"
      handle_errors: true
      max_attempts: 3
      connections:
        - from: "Initialize"
          to: "DataFetch"
        - from: "DataFetch"
          to: "DataValidation"
        - from: "DataValidation"
          to: "QualityCheck"
        - from: "QualityCheck"
          to: "AlertHandler"
          condition: "data.get('routing', {}).get('should_alert', False)"
        - from: "QualityCheck"
          to: "Reprocess"
          condition: "data.get('routing', {}).get('needs_reprocessing', False)"
        - from: "QualityCheck"
          to: "DataTransform"
          condition: "data.get('routing', {}).get('can_analyze', True)"
        - from: "AlertHandler"
          to: "DataTransform"
        - from: "Reprocess"
          to: "DataTransform"
        - from: "DataTransform"
          to: "DataAnalysis"
        - from: "DataAnalysis"
          to: "ReportGeneration"
        - from: "ReportGeneration"
          to: "Cleanup"

    # Analysis-only pipeline
    - name: "AnalysisOnly"
      description: "Run analysis on pre-loaded data"
      entry_phase: "DataAnalysis"
      handle_errors: true
      max_attempts: 2
      flow: "DataAnalysis >> ReportGeneration"

    # Validation testing pipeline
    - name: "ValidationTest"
      description: "Test validation and error handling"
      entry_phase: "Initialize"
      handle_errors: true
      max_attempts: 5
      flow: "Initialize >> DataFetch >> DataValidation >> QualityCheck"