name: "workflows"
category: "Workflow System Test"
description: |
  A comprehensive test suite for the workflow execution system. Demonstrates
  inline phases, external phase files, custom error handlers, conditional
  branching, graph composition, and integration with built-in phases.
  
  This project simulates a data processing pipeline with validation,
  transformation, analysis, and reporting stages.

specs: []
tests: []

configs:
  - name: "pipeline_config"
    description: "Data pipeline configuration"
    value:
      pipeline:
        name: "Test Data Pipeline"
        version: "1.0.0"
        strict_mode: false
      validation:
        required_fields: ["id", "timestamp", "value"]
        max_null_ratio: 0.1
        type_coercion: true
      transformation:
        normalize: true
        fill_nulls: "mean"
        outlier_method: "zscore"
        outlier_threshold: 3.0
      analysis:
        aggregations: ["sum", "mean", "std", "min", "max"]
        group_by: ["category", "region"]
      reporting:
        format: "json"
        include_metadata: true
        timestamp_format: "iso"

  - name: "test_datasets"
    description: "Test data configurations"
    value:
      small:
        records: 100
        error_rate: 0.0
        null_rate: 0.05
      medium:
        records: 1000
        error_rate: 0.01
        null_rate: 0.1

  - name: "error_scenarios"
    description: "Error injection for testing"
    value:
      - name: "transient_failure"
        phase: "data_fetch"
        probability: 0.3
        max_failures: 2

# WORKFLOW DEFINITIONS
workflows:
  phases:
    # =========================================================================
    # HELLO WORLD PHASES - Simple phases for testing/benchmarking
    # =========================================================================
    
    - name: "hello_start"
      description: "Simple start phase - initializes a counter"
      max_retries: 1
      code: |
        def forward(self, *inputs):
            """initialize with a simple greeting and counter."""
            input_data = inputs[0].data if inputs else {}
            
            name = input_data.get('name', 'World')
            start_value = input_data.get('start_value', 0)
            
            L.info(f"[hello_start] Hello, {name}! Starting with value: {start_value}")
            
            # Output to Zerg channel
            self.agent.output(
                f"🚀 [hello_start] Workflow started: Hello, {name}! Initial value: {start_value}",
                channel_name="zerg_output"
            )
            
            return ExecutionTensor(
                data={
                    'greeting': f'Hello, {name}!',
                    'counter': start_value,
                    'history': [f'start: {start_value}'],
                },
                status=PhaseStatus.COMPLETED
            )

    - name: "add_one"
      description: "Add 1 to the counter"
      max_retries: 1
      code: |
        def forward(self, *inputs):
            """Increment counter by 1."""
            input_data = inputs[0].data if inputs else {}
            
            old_counter = input_data.get('counter', 0)
            counter = old_counter + 1
            history = input_data.get('history', [])
            history.append(f'add_one: {counter}')
            
            L.info(f"[add_one] counter: {old_counter} -> {counter}")
            
            # Output to Zerg channel
            self.agent.output(
                f"➕ [add_one] {old_counter} + 1 = {counter}",
                channel_name="zerg_output"
            )
            
            return ExecutionTensor(
                data={**input_data, 'counter': counter, 'history': history},
                status=PhaseStatus.COMPLETED
            )

    - name: "double"
      description: "double the counter value"
      max_retries: 1
      code: |
        def forward(self, *inputs):
            """double the counter value."""
            input_data = inputs[0].data if inputs else {}
            
            old_counter = input_data.get('counter', 0)
            counter = old_counter * 2
            history = input_data.get('history', [])
            history.append(f'double: {counter}')
            
            L.info(f"[double] counter: {old_counter} -> {counter}")
            
            # Output to Zerg channel
            self.agent.output(
                f"✖️ [double] {old_counter} × 2 = {counter}",
                channel_name="zerg_output"
            )
            
            return ExecutionTensor(
                data={**input_data, 'counter': counter, 'history': history},
                status=PhaseStatus.COMPLETED
            )

    - name: "square"
      description: "square the counter value"
      max_retries: 1
      code: |
        def forward(self, *inputs):
            """square the counter value."""
            input_data = inputs[0].data if inputs else {}
            
            old_counter = input_data.get('counter', 0)
            counter = old_counter ** 2
            history = input_data.get('history', [])
            history.append(f'square: {counter}')
            
            L.info(f"[square] counter: {old_counter} -> {counter}")
            
            # Output to Zerg channel
            self.agent.output(
                f"² [square] {old_counter}² = {counter}",
                channel_name="zerg_output"
            )
            
            return ExecutionTensor(
                data={**input_data, 'counter': counter, 'history': history},
                status=PhaseStatus.COMPLETED
            )

    - name: "print_result"
      description: "Print the final result"
      max_retries: 1
      code: |
        def forward(self, *inputs):
            """Print final result and summary."""
            input_data = inputs[0].data if inputs else {}
            
            greeting = input_data.get('greeting', 'Hello!')
            counter = input_data.get('counter', 0)
            history = input_data.get('history', [])
            
            result = {
                'greeting': greeting,
                'final_value': counter,
                'operations': history,
                'operation_count': len(history),
            }
            
            L.info(f"[print_result] === RESULT ===")
            L.info(f"[print_result]   {greeting}")
            L.info(f"[print_result]   Final value: {counter}")
            L.info(f"[print_result]   Operations: {' -> '.join(history)}")
            
            # Output final result to Zerg channel
            self.agent.output(
                f"✅ [print_result] Workflow complete!\n"
                f"   {greeting}\n"
                f"   Final value: {counter}\n"
                f"   Operations: {' → '.join(history)}",
                channel_name="zerg_output"
            )
            
            return ExecutionTensor(
                data={**input_data, 'result': result},
                status=PhaseStatus.COMPLETED
            )

    - name: "check_threshold"
      description: "Check if counter exceeds threshold (for conditional testing)"
      max_retries: 1
      code: |
        def forward(self, *inputs):
            """Check counter against threshold and set routing flags."""
            input_data = inputs[0].data if inputs else {}
            
            counter = input_data.get('counter', 0)
            threshold = input_data.get('threshold', 10)
            
            exceeds = counter > threshold
            
            L.info(f"[check_threshold] {counter} {'>' if exceeds else '<='} {threshold}")
            
            # Output to Zerg channel
            comparison = ">" if exceeds else "≤"
            result_emoji = "🔺" if exceeds else "🔻"
            self.agent.output(
                f"{result_emoji} [check_threshold] {counter} {comparison} {threshold} → exceeds={exceeds}",
                channel_name="zerg_output"
            )
            
            return ExecutionTensor(
                data={
                    **input_data,
                    'exceeds_threshold': exceeds,
                    'threshold_check': {
                        'value': counter,
                        'threshold': threshold,
                        'exceeds': exceeds,
                    }
                },
                status=PhaseStatus.COMPLETED
            )

    - name: "log_high"
      description: "Log message for high values"
      max_retries: 1
      code: |
        def forward(self, *inputs):
            """Log that value is high."""
            input_data = inputs[0].data if inputs else {}
            counter = input_data.get('counter', 0)
            
            message = f"HIGH VALUE ALERT: {counter}"
            L.warning(f"[log_high] {message}")
            
            history = input_data.get('history', [])
            history.append(f'high_alert: {counter}')
            
            # Output high value alert
            self.agent.output(
                f"⚠️ [log_high] {message} (exceeded threshold)",
                channel_name="zerg_output"
            )
            
            return ExecutionTensor(
                data={**input_data, 'alert': message, 'history': history},
                status=PhaseStatus.COMPLETED
            )

    - name: "log_low"
      description: "Log message for low values"
      max_retries: 1
      code: |
        def forward(self, *inputs):
            """Log that value is low/normal."""
            input_data = inputs[0].data if inputs else {}
            counter = input_data.get('counter', 0)
            
            message = f"Value is normal: {counter}"
            L.info(f"[log_low] {message}")
            
            history = input_data.get('history', [])
            history.append(f'normal: {counter}')
            
            # Output normal status
            self.agent.output(
                f"✓ [log_low] {message} (within threshold)",
                channel_name="zerg_output"
            )
            
            return ExecutionTensor(
                data={**input_data, 'status': message, 'history': history},
                status=PhaseStatus.COMPLETED
            )

    # =========================================================================
    # COMPLEX PIPELINE PHASES (existing)
    # =========================================================================
    
    - name: "initialize"
      description: "initialize pipeline context and configuration"
      max_retries: 1
      code: |
        def forward(self, *inputs):
            """Set up initial pipeline state."""
            input_data = inputs[0].data if inputs else {}
            
            context = {
                'pipeline_id': input_data.get('pipeline_id', 'test-001'),
                'started_at': input_data.get('timestamp', '2024-01-01T00:00:00Z'),
                'config': input_data.get('config', {}),
                'metrics': {
                    'phases_completed': 0,
                    'records_processed': 0,
                    'errors_encountered': 0,
                },
                'stage': 'initialized',
            }
            
            L.info(f"[initialize] Pipeline {context['pipeline_id']} initialized")
            
            # Output pipeline start
            self.agent.output(
                f"📋 [initialize] Pipeline '{context['pipeline_id']}' initialized",
                channel_name="zerg_output"
            )
            
            return ExecutionTensor(
                data={'context': context, **input_data},
                status=PhaseStatus.COMPLETED
            )

    - name: "data_fetch"
      description: "Fetch data from configured source (simulated)"
      max_retries: 3
      retry_delay: 1.0
      default_error_action: "retry"
      code: |
        def forward(self, *inputs):
            """Simulate fetching data from an external source."""
            import random
            
            input_data = inputs[0].data if inputs else {}
            context = input_data.get('context', {})
            
            L.info(f"[data_fetch] Starting data fetch...")
            self.agent.output(
                f"📥 [data_fetch] Starting data fetch...",
                channel_name="zerg_output"
            )
            
            if context.get('inject_fetch_error') and random.random() < 0.5:
                raise ConnectionError("Simulated: Failed to connect to data source")
            
            dataset_config = input_data.get('dataset', {'records': 100})
            num_records = dataset_config.get('records', 100)
            
            records = []
            for i in range(num_records):
                records.append({
                    'id': f'record-{i:05d}',
                    'timestamp': f'2024-01-{(i % 28) + 1:02d}T{i % 24:02d}:00:00Z',
                    'value': random.uniform(0, 1000),
                    'category': random.choice(['A', 'B', 'C', 'D']),
                    'region': random.choice(['north', 'south', 'east', 'west']),
                    'is_valid': random.random() > dataset_config.get('null_rate', 0.1),
                })
            
            context['stage'] = 'data_fetched'
            context['metrics']['records_processed'] = len(records)
            
            L.info(f"[data_fetch] Fetched {len(records)} records")
            
            # Output fetch complete
            self.agent.output(
                f"✓ [data_fetch] Fetched {len(records)} records successfully",
                channel_name="zerg_output"
            )
            
            return ExecutionTensor(
                data={'context': context, 'records': records, **input_data},
                status=PhaseStatus.COMPLETED
            )
      
      on_error: |
        def on_error(self, error, input_tensor, attempt):
            """Retry on connection errors with exponential backoff."""
            error_str = str(error).lower()
            
            if 'connection' in error_str or 'timeout' in error_str:
                delay = min(2 ** attempt, 30)
                L.warning(f"[data_fetch] attempt {attempt} failed, retrying in {delay}s")
                
                # Output retry attempt
                self.agent.output(
                    f"🔄 [data_fetch] Failed (attempt {attempt}), retrying in {delay}s...",
                    channel_name="zerg_output"
                )
                
                return ErrorHandlerResult(
                    action=ErrorAction.RETRY,
                    retry_delay=delay,
                    should_log=True,
                    error_message=f"Transient error, attempt {attempt}"
                )
            
            # Output failure
            self.agent.output(
                f"❌ [data_fetch] Failed permanently: {error}",
                channel_name="zerg_output"
            )
            
            return ErrorHandlerResult(
                action=ErrorAction.FAIL,
                error_message=f"Non-recoverable error: {error}"
            )

    - name: "data_validation"
      description: "Validate fetched data against schema"
      max_retries: 2
      code: |
        def forward(self, *inputs):
            """Validate records and separate valid/invalid."""
            input_data = inputs[0].data if inputs else {}
            records = input_data.get('records', [])
            
            L.info(f"[data_validation] Validating {len(records)} records...")
            self.agent.output(
                f"🔍 [data_validation] Validating {len(records)} records...",
                channel_name="zerg_output"
            )
            
            valid_records = []
            invalid_records = []
            
            for record in records:
                if record.get('is_valid', True) and record.get('value') is not None:
                    valid_records.append(record)
                else:
                    invalid_records.append(record)
            
            L.info(f"[data_validation] Result: {len(valid_records)} valid, {len(invalid_records)} invalid")
            
            # Output validation results
            valid_pct = len(valid_records) / len(records) * 100 if records else 0
            self.agent.output(
                f"✓ [data_validation] Complete: {len(valid_records)}/{len(records)} valid ({valid_pct:.1f}%)",
                channel_name="zerg_output"
            )
            
            return ExecutionTensor(
                data={
                    **input_data,
                    'valid_records': valid_records,
                    'invalid_records': invalid_records,
                    'valid_count': len(valid_records),
                    'invalid_count': len(invalid_records),
                },
                status=PhaseStatus.COMPLETED
            )

    - name: "data_transform"
      description: "Transform and normalize data"
      max_retries: 2
      retry_delay: 0.5
      code: |
        def forward(self, *inputs):
            """Transform valid records."""
            input_data = inputs[0].data if inputs else {}
            valid_records = input_data.get('valid_records', [])
            
            L.info(f"[data_transform] Transforming {len(valid_records)} records...")
            self.agent.output(
                f"🔄 [data_transform] Transforming {len(valid_records)} records...",
                channel_name="zerg_output"
            )
            
            # Simple transformation: normalize values
            if valid_records:
                values = [r.get('value', 0) for r in valid_records]
                max_val = max(values) if values else 1
                
                for record in valid_records:
                    record['normalized_value'] = record.get('value', 0) / max_val
            
            L.info(f"[data_transform] Transformed {len(valid_records)} records")
            self.agent.output(
                f"✓ [data_transform] Transformed {len(valid_records)} records (normalized to max={max_val:.2f})" if valid_records else f"✓ [data_transform] No records to transform",
                channel_name="zerg_output"
            )
            
            return ExecutionTensor(
                data={**input_data, 'valid_records': valid_records, 'transformed': True},
                status=PhaseStatus.COMPLETED
            )

    - name: "data_analysis"
      description: "Perform analysis and aggregations"
      max_retries: 1
      code: |
        def forward(self, *inputs):
            """Compute basic statistics."""
            input_data = inputs[0].data if inputs else {}
            valid_records = input_data.get('valid_records', [])
            
            L.info(f"[data_analysis] Analyzing {len(valid_records)} records...")
            self.agent.output(
                f"📊 [data_analysis] Analyzing {len(valid_records)} records...",
                channel_name="zerg_output"
            )
            
            values = [r.get('value', 0) for r in valid_records]
            
            analysis = {
                'count': len(values),
                'sum': sum(values) if values else 0,
                'mean': sum(values) / len(values) if values else 0,
                'min': min(values) if values else 0,
                'max': max(values) if values else 0,
            }
            
            L.info(f"[data_analysis] Complete: mean={analysis['mean']:.2f}")
            
            # Output analysis summary
            self.agent.output(
                f"✓ [data_analysis] Complete:\n"
                f"   Count: {analysis['count']}\n"
                f"   Mean: {analysis['mean']:.2f}\n"
                f"   Range: [{analysis['min']:.2f}, {analysis['max']:.2f}]",
                channel_name="zerg_output"
            )
            
            return ExecutionTensor(
                data={**input_data, 'analysis': analysis},
                status=PhaseStatus.COMPLETED
            )

    - name: "report_generation"
      description: "Generate final report"
      max_retries: 2
      default_error_action: "continue"
      code: |
        def forward(self, *inputs):
            """Generate a summary report."""
            input_data = inputs[0].data if inputs else {}
            context = input_data.get('context', {})
            analysis = input_data.get('analysis', {})
            
            L.info(f"[report_generation] Generating report...")
            self.agent.output(
                f"📝 [report_generation] Generating report...",
                channel_name="zerg_output"
            )
            
            report = {
                'pipeline_id': context.get('pipeline_id'),
                'status': 'completed',
                'metrics': context.get('metrics', {}),
                'summary': {
                    'total_records': context.get('metrics', {}).get('records_processed', 0),
                    'valid_records': input_data.get('valid_count', 0),
                    'invalid_records': input_data.get('invalid_count', 0),
                    'analysis': analysis,
                },
            }
            
            L.info(f"[report_generation] Report generated for pipeline {report['pipeline_id']}")
            
            # Output report summary
            self.agent.output(
                f"✓ [report_generation] Report for '{report['pipeline_id']}':\n"
                f"   Total: {report['summary']['total_records']} records\n"
                f"   Valid: {report['summary']['valid_records']}\n"
                f"   Invalid: {report['summary']['invalid_records']}",
                channel_name="zerg_output"
            )
            
            return ExecutionTensor(
                data={'context': context, 'report': report, **input_data},
                status=PhaseStatus.COMPLETED
            )

    - name: "cleanup"
      description: "cleanup temporary resources"
      max_retries: 1
      code: |
        def forward(self, *inputs):
            """Clean up resources."""
            input_data = inputs[0].data if inputs else {}
            context = input_data.get('context', {})
            
            L.info(f"[cleanup] Cleaning up resources...")
            self.agent.output(
                f"🧹 [cleanup] Cleaning up resources...",
                channel_name="zerg_output"
            )
            
            context['stage'] = 'completed'
            
            L.info("[cleanup] Pipeline cleanup completed")
            
            # Output pipeline completion
            pipeline_id = context.get('pipeline_id', 'unknown')
            self.agent.output(
                f"✅ [cleanup] Pipeline '{pipeline_id}' completed successfully",
                channel_name="zerg_output"
            )
            
            return ExecutionTensor(
                data={'context': context, 'cleanup': True, **input_data},
                status=PhaseStatus.COMPLETED
            )

    - name: "quality_check"
      description: "Check data quality and decide next steps"
      max_retries: 1
      code: |
        def forward(self, *inputs):
            """Evaluate data quality and set routing flags."""
            input_data = inputs[0].data if inputs else {}
            
            valid_count = input_data.get('valid_count', 0)
            total_count = input_data.get('context', {}).get('metrics', {}).get('records_processed', 1)
            
            L.info(f"[quality_check] Checking quality: {valid_count}/{total_count} valid...")
            self.agent.output(
                f"🔎 [quality_check] Checking quality: {valid_count}/{total_count} valid...",
                channel_name="zerg_output"
            )
            
            quality_ratio = valid_count / max(total_count, 1)
            
            routing = {
                'needs_reprocessing': quality_ratio < 0.8,
                'can_analyze': quality_ratio >= 0.5,
                'should_alert': quality_ratio < 0.5,
                'quality_score': quality_ratio,
            }
            
            L.info(f"[quality_check] Quality score: {quality_ratio:.1%}")
            
            # Output routing decision
            status_emoji = "✅" if quality_ratio >= 0.8 else ("⚠️" if quality_ratio >= 0.5 else "❌")
            self.agent.output(
                f"{status_emoji} [quality_check] Quality: {quality_ratio:.1%}\n"
                f"   needs_reprocessing: {routing['needs_reprocessing']}\n"
                f"   can_analyze: {routing['can_analyze']}\n"
                f"   should_alert: {routing['should_alert']}",
                channel_name="zerg_output"
            )
            
            return ExecutionTensor(
                data={**input_data, 'routing': routing},
                status=PhaseStatus.COMPLETED
            )

    - name: "alert_handler"
      description: "Handle quality alerts"
      max_retries: 1
      code: |
        def forward(self, *inputs):
            """Send alerts for poor quality data."""
            input_data = inputs[0].data if inputs else {}
            quality_score = input_data.get('routing', {}).get('quality_score', 1.0)
            
            L.info(f"[alert_handler] Handling alert for quality score: {quality_score:.1%}")
            self.agent.output(
                f"🚨 [alert_handler] Processing alert for quality score: {quality_score:.1%}",
                channel_name="zerg_output"
            )
            
            alert = {
                'type': 'data_quality_warning',
                'severity': 'high' if quality_score < 0.3 else 'medium',
                'message': f'Data quality below threshold: {quality_score:.1%}',
            }
            
            L.warning(f"[alert_handler] Alert: {alert['message']}")
            warnings = input_data.get('warnings', [])
            warnings.append(alert)
            
            # Output alert to Zerg
            severity_emoji = "🔴" if alert['severity'] == 'high' else "🟡"
            self.agent.output(
                f"{severity_emoji} [alert_handler] ALERT [{alert['severity'].upper()}]: {alert['message']}",
                channel_name="zerg_output"
            )
            
            return ExecutionTensor(
                data={**input_data, 'warnings': warnings, 'alert_sent': True},
                status=PhaseStatus.COMPLETED
            )

    - name: "reprocess"
      description: "Attempt to recover bad records"
      max_retries: 2
      code: |
        def forward(self, *inputs):
            """Try to recover invalid records."""
            input_data = inputs[0].data if inputs else {}
            
            invalid_records = input_data.get('invalid_records', [])
            
            L.info(f"[reprocess] Attempting to recover {len(invalid_records)} invalid records...")
            self.agent.output(
                f"♻️ [reprocess] Attempting to recover {len(invalid_records)} invalid records...",
                channel_name="zerg_output"
            )
            
            recovered = []
            still_invalid = []
            
            for record in invalid_records:
                if record.get('value') is None:
                    record['value'] = 0
                    record['recovered'] = True
                    recovered.append(record)
                else:
                    still_invalid.append(record)
            
            valid_records = input_data.get('valid_records', [])
            valid_records.extend(recovered)
            
            L.info(f"[reprocess] Recovered {len(recovered)} records, {len(still_invalid)} still invalid")
            self.agent.output(
                f"✓ [reprocess] Recovered {len(recovered)} records\n"
                f"   Now valid: {len(valid_records)}\n"
                f"   Still invalid: {len(still_invalid)}",
                channel_name="zerg_output"
            )
            
            return ExecutionTensor(
                data={
                    **input_data,
                    'valid_records': valid_records,
                    'invalid_records': still_invalid,
                    'valid_count': len(valid_records),
                    'invalid_count': len(still_invalid),
                },
                status=PhaseStatus.COMPLETED
            )

  # GRAPH DEFINITIONS
  graphs:
    # =========================================================================
    # HELLO WORLD GRAPHS - Simple graphs for testing/benchmarking
    # =========================================================================
    
    # Simplest possible graph - just start and print
    - name: "hello_world"
      description: "Simplest possible workflow - just says hello"
      entry_phase: "hello_start"
      handle_errors: true
      max_attempts: 1
      flow: "hello_start >> print_result"

    # Simple linear math: start(0) -> +1 -> *2 -> print = 2
    - name: "simple_math"
      description: "Simple linear math operations: (start + 1) * 2"
      entry_phase: "hello_start"
      handle_errors: true
      max_attempts: 1
      flow: "hello_start >> add_one >> double >> print_result"

    # More complex math: start(0) -> +1 -> square -> *2 -> print = 2
    - name: "math_chain"
      description: "Chained math: ((start + 1) ^ 2) * 2"
      entry_phase: "hello_start"
      handle_errors: true
      max_attempts: 1
      flow: "hello_start >> add_one >> square >> double >> print_result"

    # Conditional branching based on threshold
    - name: "conditional_hello"
      description: "Conditional branching - different paths based on value"
      entry_phase: "hello_start"
      handle_errors: true
      max_attempts: 1
      connections:
        - from: "hello_start"
          to: "add_one"
        - from: "add_one"
          to: "square"
        - from: "square"
          to: "check_threshold"
        # Branch based on threshold
        - from: "check_threshold"
          to: "log_high"
          condition: "data.get('exceeds_threshold', False)"
        - from: "check_threshold"
          to: "log_low"
          condition: "not data.get('exceeds_threshold', True)"
        # Both paths converge to print_result
        - from: "log_high"
          to: "print_result"
        - from: "log_low"
          to: "print_result"

