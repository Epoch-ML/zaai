# Docker Compose for Strudel REPL Server
# Usage: docker-compose up

version: '3.8'

services:
  strudel-repl:
    build: .
    ports:
      - "7777:7777"
    environment:
      - NODE_ENV=production
      - PORT=7777
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7777/health"]
      interval: 10s
      timeout: 3s
      retries: 3