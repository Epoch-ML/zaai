# Docker Compose for Strudel REPL Server
# Usage: docker-compose up

version: '3.8'

services:
  strudel-repl:
    build: .
    ports:
      - "3333:3333"
    environment:
      - NODE_ENV=production
      - PORT=3333
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3333/health"]
      interval: 10s
      timeout: 3s
      retries: 3