<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strudel REPL</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
    <script src="https://unpkg.com/@strudel/repl@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            height: 100%; 
            background: #1a1a2e; 
            font-family: system-ui, -apple-system, sans-serif;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
            z-index: 1;
        }
        
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            background: #16161e;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
            position: relative;
            z-index: 10;
        }
        
        .logo {
            color: #7aa2f7;
            font-weight: bold;
            font-size: 16px;
        }
        
        .controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .btn {
            padding: 6px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.15s;
        }
        
        .btn-play {
            background: #4ade80;
            color: #000;
        }
        .btn-play:hover { background: #22c55e; }
        .btn-play.playing {
            background: #f472b6;
        }
        
        .btn-stop {
            background: #ef4444;
            color: #fff;
        }
        .btn-stop:hover { background: #dc2626; }
        
        .btn-secondary {
            background: #333;
            color: #ccc;
        }
        .btn-secondary:hover { background: #444; }
        
        .status {
            color: #666;
            font-size: 12px;
        }
        
        .status.playing {
            color: #4ade80;
        }
        
        .hints {
            color: #555;
            font-size: 11px;
        }
        
        kbd {
            background: #333;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 10px;
            margin-left: 4px;
        }
        
        .editor-container {
            height: calc(100vh - 50px);
            position: relative;
            overflow: visible;
            z-index: 200;
        }
        
        strudel-editor {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            height: 100%;
            width: 100%;
            z-index: 200;
        }
        
        strudel-editor > div,
        strudel-editor > div > div {
            height: 100% !important;
            position: relative !important;
            z-index: 200 !important;
        }
        
        .cm-editor {
            height: 100% !important;
            position: relative !important;
            z-index: 200 !important;
            background: #1e1e2e !important;
        }
        
        .cm-scroller {
            height: 100% !important;
            overflow: auto !important;
            z-index: 200 !important;
        }
        
        .cm-gutters {
            z-index: 201 !important;
        }
        
        .cm-content {
            z-index: 201 !important;
        }
        
        #test-canvas, canvas[id*="canvas"] {
            z-index: 1 !important;
        }
        
        /* Audio unlock overlay */
        .audio-unlock-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        
        .audio-unlock-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .audio-unlock-content {
            text-align: center;
            color: white;
        }
        
        .audio-unlock-icon {
            font-size: 72px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        
        .audio-unlock-text {
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .audio-unlock-hint {
            font-size: 14px;
            color: #888;
        }
        
        /* Audio status indicator */
        .audio-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            background: #2a2a3a;
        }
        
        .audio-indicator.locked {
            color: #ef4444;
        }
        
        .audio-indicator.unlocked {
            color: #4ade80;
        }
        
        .audio-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }
    </style>
</head>
<body>
    <!-- Audio unlock overlay -->
    <div class="audio-unlock-overlay" id="audioUnlockOverlay">
        <div class="audio-unlock-content">
            <div class="audio-unlock-icon">🔊</div>
            <div class="audio-unlock-text">Click anywhere to enable audio</div>
            <div class="audio-unlock-hint">Browser requires user interaction for sound</div>
        </div>
    </div>

    <div class="container">
        <header class="header">
            <div class="logo">🎵 Strudel REPL</div>
            <div class="controls">
                <div class="audio-indicator locked" id="audioIndicator">
                    <span class="audio-dot"></span>
                    <span id="audioStatus">Audio Locked</span>
                </div>
                <button class="btn btn-play" id="playBtn" onclick="togglePlay()">▶ Play</button>
                <button class="btn btn-stop" onclick="stopPlay()">⏹ Stop</button>
                <button class="btn btn-secondary" onclick="shuffleDemo()">🎲 Random</button>
            </div>
            <div class="hints">
                <kbd>Ctrl+Enter</kbd> play
                <kbd>Ctrl+.</kbd> stop
            </div>
            <div class="status" id="status">Ready</div>
        </header>
        
        <div class="editor-container" id="editor-container">
            <strudel-editor id="repl"></strudel-editor>
        </div>
    </div>
    
    <script>
        // Demo songs collection
        const demos = [
            {
                name: "Lounge Sponge",
                code: `// "Lounge Sponge" by Felix Roos
// Press Ctrl+Enter to play, Ctrl+. to stop

samples('github:tidalcycles/dirt-samples')

stack(
  note("<c3 a2 f2 g2>/2").sound('sawtooth')
    .cutoff(500).lpf(sine.range(400,2000).slow(8)),
  note("<c2 a1 f1 g1>/2").sound('sawtooth').lpf(200),
  n("0 1 2 3").scale("C:minor").sound('triangle'),
  s("bd*2,~ cp,hh*4").bank('RolandTR909')
)`
            },
            {
                name: "Minimal Techno",
                code: `// Minimal Techno
samples('github:tidalcycles/dirt-samples')

stack(
  s("bd*4").gain(1.2),
  s("~ cp").delay(.5).delaytime(.125),
  s("hh*8").gain(.5).pan(sine),
  note("<c2 c2 f2 g2>").sound('sawtooth').lpf(800).decay(.1)
).cpm(130)`
            },
            {
                name: "Ambient Pad",
                code: `// Ambient Pad
stack(
  note("<C3 E3 G3 B3>").slow(2).sound('sawtooth')
    .cutoff(sine.range(300, 1500).slow(8))
    .resonance(10)
    .attack(0.5).decay(0.5).sustain(0.8).release(2)
    .room(0.9).size(0.9),
  note("<C2 G1>").slow(4).sound('sine').gain(0.6)
).slow(2)`
            },
            {
                name: "Arpeggio",
                code: `// Arpeggio Pattern
note("<c4 e4 g4 b4 c5 b4 g4 e4>*2")
  .sound('triangle')
  .cutoff(perlin.range(500, 3000).slow(4))
  .delay(0.5).delaytime(0.125).delayfeedback(0.6)
  .room(0.5)`
            },
            {
                name: "Polyrhythm",
                code: `// Polyrhythm
samples('github:tidalcycles/dirt-samples')

stack(
  s("bd(3,8)").gain(1.2),
  s("cp(2,5)").delay(0.3),
  s("hh(7,12)").gain(0.4),
  n("0 2 4 7").fast(1.5).scale("C:minor").sound('sine')
    .decay(0.1).sustain(0)
)`
            },
            {
                name: "Glitch Beats",
                code: `// Glitch Beats
samples('github:tidalcycles/dirt-samples')

s("bd sd cp hh").bank('RolandTR909')
  .sometimes(x => x.speed(2))
  .rarely(x => x.crush(4))
  .delay(0.25)`
            }
        ];
        
        let currentDemo = 0;
        let isPlaying = false;
        let audioUnlocked = false;
        let pendingPlay = null; // Store pending play command
        
        const playBtn = document.getElementById('playBtn');
        const status = document.getElementById('status');
        const audioIndicator = document.getElementById('audioIndicator');
        const audioStatus = document.getElementById('audioStatus');
        const audioUnlockOverlay = document.getElementById('audioUnlockOverlay');
        
        // Get the strudel repl element
        function getRepl() {
            return document.getElementById('repl');
        }
        
        // Wait for editor to be ready
        function waitForEditor() {
            return new Promise((resolve) => {
                const check = () => {
                    const repl = getRepl();
                    if (repl?.editor) {
                        resolve(repl.editor);
                    } else {
                        setTimeout(check, 100);
                    }
                };
                check();
            });
        }
        
        // Audio unlock function
        async function unlockAudio() {
            if (audioUnlocked) return true;
            
            console.log('Attempting to unlock audio...');
            
            try {
                const editor = await waitForEditor();
                
                // Try to get AudioContext from various places
                let audioContext = null;
                
                // Method 1: Check if Strudel exposes getAudioContext
                if (typeof getAudioContext === 'function') {
                    audioContext = getAudioContext();
                }
                
                // Method 2: Try global AudioContext
                if (!audioContext && window.AudioContext) {
                    // Create a temporary context to trigger unlock
                    const tempCtx = new AudioContext();
                    if (tempCtx.state === 'suspended') {
                        await tempCtx.resume();
                    }
                    // Create a silent oscillator to fully unlock
                    const oscillator = tempCtx.createOscillator();
                    const gain = tempCtx.createGain();
                    gain.gain.value = 0;
                    oscillator.connect(gain);
                    gain.connect(tempCtx.destination);
                    oscillator.start();
                    oscillator.stop(tempCtx.currentTime + 0.001);
                }
                
                // Method 3: Try to play and immediately stop to unlock Strudel's context
                try {
                    await editor.evaluate();
                    await new Promise(r => setTimeout(r, 50));
                    editor.stop();
                } catch (e) {
                    console.log('Pre-evaluate for unlock:', e.message);
                }
                
                audioUnlocked = true;
                console.log('Audio unlocked successfully!');
                
                // Update UI
                audioIndicator.classList.remove('locked');
                audioIndicator.classList.add('unlocked');
                audioStatus.textContent = 'Audio Ready';
                audioUnlockOverlay.classList.add('hidden');
                
                // If there was a pending play command, execute it now
                if (pendingPlay) {
                    console.log('Executing pending play command...');
                    const playFn = pendingPlay;
                    pendingPlay = null;
                    await playFn();
                }
                
                return true;
            } catch (e) {
                console.error('Audio unlock failed:', e);
                return false;
            }
        }
        
        // Click handler to unlock audio
        document.addEventListener('click', async (e) => {
            if (!audioUnlocked) {
                await unlockAudio();
            }
        }, { once: false });
        
        // Also unlock on keypress
        document.addEventListener('keydown', async (e) => {
            if (!audioUnlocked && (e.key === 'Enter' || e.key === ' ')) {
                await unlockAudio();
            }
        }, { once: false });
        
        // Initialize
        async function init() {
            const editor = await waitForEditor();
            
            console.log('Strudel REPL ready!');
            
            // Set initial code
            editor.setCode(demos[0].code);
            status.textContent = demos[0].name;
            
            // Fix editor height after a short delay
            setTimeout(() => {
                fixEditorHeight();
            }, 200);
        }
        
        function fixEditorHeight() {
            const container = document.getElementById('editor-container');
            const repl = document.getElementById('repl');
            const height = container.offsetHeight;
            
            const innerDiv = repl.querySelector('div');
            if (innerDiv) {
                innerDiv.style.height = height + 'px';
                innerDiv.style.minHeight = height + 'px';
            }
            
            const cmEditor = repl.querySelector('.cm-editor');
            if (cmEditor) {
                cmEditor.style.height = height + 'px';
                cmEditor.style.minHeight = height + 'px';
            }
            
            const cmScroller = repl.querySelector('.cm-scroller');
            if (cmScroller) {
                cmScroller.style.height = height + 'px';
                cmScroller.style.minHeight = height + 'px';
            }
        }
        
        window.addEventListener('resize', fixEditorHeight);
        
        function updatePlayButton() {
            if (isPlaying) {
                playBtn.textContent = '⏸ Pause';
                playBtn.classList.add('playing');
                status.classList.add('playing');
                status.textContent = '♫ Playing...';
            } else {
                playBtn.textContent = '▶ Play';
                playBtn.classList.remove('playing');
                status.classList.remove('playing');
                status.textContent = demos[currentDemo]?.name || 'Ready';
            }
        }
        
        async function togglePlay() {
            // Ensure audio is unlocked first
            if (!audioUnlocked) {
                await unlockAudio();
            }
            
            const editor = await waitForEditor();
            console.log('togglePlay called, isPlaying:', isPlaying);
            
            try {
                editor.toggle();
                isPlaying = !isPlaying;
                updatePlayButton();
            } catch(e) { 
                console.error('Toggle error:', e);
                if (!isPlaying) {
                    try {
                        await editor.evaluate();
                        isPlaying = true;
                        updatePlayButton();
                    } catch(e2) {
                        console.error('Evaluate error:', e2);
                    }
                }
            }
        }
        
        async function stopPlay() {
            const editor = await waitForEditor();
            try {
                editor.stop();
            } catch(e) { console.error('Stop error:', e); }
            isPlaying = false;
            updatePlayButton();
        }
        
        async function shuffleDemo() {
            await stopPlay();
            
            let next;
            do {
                next = Math.floor(Math.random() * demos.length);
            } while (next === currentDemo && demos.length > 1);
            
            currentDemo = next;
            
            const editor = await waitForEditor();
            editor.setCode(demos[currentDemo].code);
            
            status.textContent = demos[currentDemo].name;
        }
        
        // Expose for debugging
        window.getRepl = getRepl;
        window.demos = demos;
        window.unlockAudio = unlockAudio;
        window.isAudioUnlocked = () => audioUnlocked;
        
        // WebSocket connection for receiving commands from server
        function connectWebSocket() {
            const ws = new WebSocket(`ws://${window.location.host}/ws`);
            
            ws.onopen = () => {
                console.log('WebSocket connected');
                const dot = document.createElement('span');
                dot.style.cssText = 'display:inline-block;width:8px;height:8px;background:#4ade80;border-radius:50%;margin-right:6px;';
                
                // Only update if audio is already unlocked, otherwise keep the unlock prompt
                if (audioUnlocked) {
                    status.innerHTML = '';
                    status.appendChild(dot);
                    status.appendChild(document.createTextNode('Connected'));
                }
            };
            
            ws.onmessage = async (event) => {
                const msg = JSON.parse(event.data);
                console.log('WebSocket message:', msg);
                
                const editor = await waitForEditor();
                
                switch (msg.type) {
                    case 'set-code':
                        editor.setCode(msg.code);
                        status.textContent = '📝 Code received';
                        status.style.color = '#60a5fa';
                        console.log('Code set from server');
                        // Flash the editor container
                        const container = document.getElementById('editor-container');
                        container.style.outline = '2px solid #60a5fa';
                        setTimeout(() => container.style.outline = '', 300);
                        break;
                        
                    case 'play':
                        console.log('Received play command, audioUnlocked:', audioUnlocked);
                        
                        const doPlay = async () => {
                            try {
                                await editor.evaluate();
                                isPlaying = true;
                                updatePlayButton();
                                status.textContent = '▶ Playing';
                                status.style.color = '#4ade80';
                            } catch(e) {
                                console.error('Play error:', e);
                                status.textContent = '❌ Play failed';
                                status.style.color = '#ef4444';
                            }
                        };
                        
                        if (!audioUnlocked) {
                            console.log('Audio not unlocked, queuing play command...');
                            pendingPlay = doPlay;
                            status.textContent = '🔇 Click to enable audio & play';
                            status.style.color = '#facc15';
                            // Flash the overlay to draw attention
                            audioUnlockOverlay.style.background = 'rgba(250, 204, 21, 0.9)';
                            setTimeout(() => {
                                audioUnlockOverlay.style.background = 'rgba(0, 0, 0, 0.85)';
                            }, 200);
                        } else {
                            await doPlay();
                        }
                        break;
                        
                    case 'stop':
                        console.log('Received stop command');
                        try {
                            editor.stop();
                            isPlaying = false;
                            updatePlayButton();
                            status.textContent = '⏹ Stopped';
                            status.style.color = '#ef4444';
                        } catch(e) {
                            console.error('Stop error:', e);
                        }
                        break;
                        
                    case 'replay':
                        console.log('Received replay command');
                        
                        const doReplay = async () => {
                            try {
                                editor.stop();
                                status.textContent = '🔄 Restarting...';
                                status.style.color = '#facc15';
                                await new Promise(r => setTimeout(r, 100));
                                await editor.evaluate();
                                isPlaying = true;
                                updatePlayButton();
                                status.textContent = '▶ Playing';
                                status.style.color = '#4ade80';
                            } catch(e) {
                                console.error('Replay error:', e);
                            }
                        };
                        
                        if (!audioUnlocked) {
                            pendingPlay = doReplay;
                            status.textContent = '🔇 Click to enable audio & play';
                            status.style.color = '#facc15';
                        } else {
                            await doReplay();
                        }
                        break;
                        
                    case 'connected':
                        console.log('Server acknowledged connection');
                        break;
                }
            };
            
            ws.onclose = () => {
                console.log('WebSocket disconnected, reconnecting in 2s...');
                setTimeout(connectWebSocket, 2000);
            };
            
            ws.onerror = (err) => {
                console.error('WebSocket error:', err);
            };
            
            window.ws = ws;
        }
        
        // Initialize
        init();
        connectWebSocket();
    </script>
</body>
</html>
