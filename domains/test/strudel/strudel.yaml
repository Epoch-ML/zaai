# Strudel Live Coding REPL Client
name: "strudel"
category: "Live Coding / Music Programming"
description: "Create a client integration with Strudel REPL for programmatic music generation and playback, including genre-specific song implementations"

stages:
  - name: deploy strudel repl
    type: before
    description: |
      Deploys a minimal Strudel REPL web application using Bun/Node.
      Copies server files from stages/strudel-repl/ and starts the server.
    preconditions: Node.js 18+ or Bun installed
    postconditions: Strudel REPL server is running at http://localhost:7777
    workspace_path: "strudel/"
    code_to_run: !python/program stages/0-deploy-strudel-repl.py

  - name: verify repl connection
    type: before
    description: Verifies the Strudel REPL is responding and can evaluate basic patterns
    preconditions: REPL server is running
    postconditions: REPL responds to health check and basic pattern evaluation
    workspace_path: "strudel/"
    code_to_run: !python/program stages/1-verify-repl-connection.py

  - name: stage patterns
    type: before
    description: Stages test pattern libraries and verifies they work
    preconditions: REPL is running and verified
    postconditions: Test patterns are loaded and validated
    workspace_path: "strudel/"
    code_to_run: !python/program stages/2-stage-patterns.py

  - name: cleanup strudel repl
    type: after
    description: Tears down the Strudel REPL server and cleans up resources
    preconditions: Testing has completed
    postconditions: REPL server stopped, temporary files removed
    workspace_path: "strudel/"
    code_to_run: !python/program stages/3-cleanup-strudel-repl.py

references: 
  - description: "strudel repl code"
    file_path: "stages/strudel-repl/**/*"
    workspace_path: "strudel/strudel-repl/"
    format: "glob"
    required: true
    read_only: true

specs:
  - description: |
      The Strudel Client is able to connect to and communicate with a Strudel REPL server
    preconditions: |
      This spec has no strict preconditions
    postconditions: |
      The Strudel client is able to establish connection with the REPL server;
      The StrudelClientConfig contains the repl_url field for the server endpoint;
      The client can perform health checks to verify server availability;

  - description: |
      The Strudel Client is able to evaluate JavaScript/Strudel pattern code headlessly
    preconditions: |
      A valid connection to the Strudel REPL server
    postconditions: |
      Client successfully sends pattern code to the /evaluate endpoint;
      Client receives and parses the evaluation response including events array;
      Client can specify query time range (queryStart, queryEnd) for pattern evaluation;
      Evaluation errors are properly captured and returned with error details;

  - description: |
      The Strudel Client is able to control playback in connected browser instances
    preconditions: |
      A valid connection to the Strudel REPL server;
      At least one browser connected to the REPL WebSocket;
    postconditions: |
      Client can send code to browser via set_code method;
      Client can trigger playback via play method;
      Client can stop playback via stop method;
      Client can restart playback via replay method;
      Client reports the number of connected browser clients;

  - description: |
      The Strudel Client is able to load and play songs from JavaScript files with proper lifecycle management
    preconditions: |
      A valid connection to the Strudel REPL server;
      Browser connected for audio playback;
    postconditions: |
      Client can load song code from a file path via load_song method;
      Client can play a song for a specified duration in seconds;
      Client properly waits for the song duration before returning;
      Client can stop playback and verify it has stopped;
      The play_song method accepts JavaScript/Strudel code and duration parameters;

  - description: |
      A trance song is implemented as a JavaScript file with appropriate musical characteristics
    preconditions: |
      Understanding of Strudel/TidalCycles pattern syntax
    postconditions: |
      The file strudel/songs/trance.js exists and contains valid Strudel code;
      The song features trance characteristics: arpeggiated melodies, filter sweeps, atmospheric pads;
      The song uses delay and reverb effects typical of trance;
      The code can be evaluated without errors by the Strudel REPL;

  - description: |
      A techno song is implemented as a JavaScript file with appropriate musical characteristics
    preconditions: |
      Understanding of Strudel/TidalCycles pattern syntax
    postconditions: |
      The file strudel/songs/techno.js exists and contains valid Strudel code;
      The song features techno characteristics: four-on-the-floor kick, driving hi-hats, percussive elements;
      The song uses drum machine sounds (909/808 style);
      The code can be evaluated without errors by the Strudel REPL;

tests:
  - description: |
      Verify Strudel client can connect and evaluate patterns
    preconditions: |
      Strudel REPL server running at configured URL
    postconditions: |
      Client successfully connects to REPL server;
      Client can evaluate mini-notation patterns;
      Client receives correct event counts from evaluation;
      Client properly handles evaluation errors;
    function_to_run: !python/file 1-test-client-connection.py

  - description: |
      Load and play the trance song through the Strudel client
    preconditions: |
      Strudel REPL server running;
      Browser connected for audio playback;
      strudel/songs/trance.js exists with valid Strudel code;
    postconditions: |
      Client loads trance.js successfully;
      Song code validates without evaluation errors;
      Song plays for the specified duration;
      Playback completes successfully before test ends;
    function_to_run: !python/file 2-test-trance-song.py

  - description: |
      Load and play the techno song through the Strudel client
    preconditions: |
      Strudel REPL server running;
      Browser connected for audio playback;
      strudel/songs/techno.js exists with valid Strudel code;
    postconditions: |
      Client loads techno.js successfully;
      Song code validates without evaluation errors;
      Song plays for the specified duration;
      Playback completes successfully before test ends;
    function_to_run: !python/file 3-test-techno-song.py

configs:
  - name: "strudel_repl_url"
    description: "The base URL of the Strudel REPL server, included as repl_url in StrudelClientConfig"
    value: "http://localhost:7777"
    is_field: true
    is_secret: false
    config_key: repl_url

  - name: "strudel_ws_url"
    description: "WebSocket URL for real-time communication with REPL"
    value: "ws://localhost:7777/ws"
    is_field: true
    is_secret: false
    config_key: ws_url

  - name: "strudel_request_timeout"
    description: "Request timeout in seconds for API calls"
    value: 30
    is_field: true
    config_key: timeout

  - name: "strudel_default_song_duration"
    description: "Default duration in seconds for song playback"
    value: 10

  - name: "client_module"
    description: "Name of client module"
    value: "strudel"

  - name: "client_name"
    description: "Name of client"
    value: "Strudel"

  - name: "song_files"
    description: "Song files that should be generated"
    value:
      trance: "strudel/songs/trance.js"
      techno: "strudel/songs/techno.js"

  - name: "expected_client_methods"
    description: "Expected methods on the StrudelClient class"
    value: [
      health_check,
      evaluate,
      set_code,
      play,
      stop,
      replay,
      play_song,
      load_song
    ]

  - name: "api_endpoints"
    description: "REPL server API endpoints used by the client"
    value:
      health: "GET /health"
      evaluate: "POST /evaluate"
      set_code: "POST /set-code"
      play: "POST /play"
      stop: "POST /stop"
      replay: "POST /replay"

  - name: "additional_considerations"
    description: |
      Additional considerations for the generation of the Strudel client and songs
    value: [
      "StrudelClientConfig should be a simple config class with repl_url, ws_url, and timeout fields",
      "The client should handle both headless evaluation (no audio) and browser playback (with audio)",
      "The load_song method should read a JavaScript file and return its contents as a string",
      "The play_song method should use asyncio.sleep or time.sleep to wait for the duration",
      "All API calls should include proper error handling and timeout management",
      "The client should work without requiring browser connection for headless evaluation",
      "Song JS files should be self-contained valid Strudel code that can be evaluated directly",
      "Trance song should feature: arpeggios, pads, filter sweeps, delay/reverb, ~130-140 BPM feel",
      "Techno song should feature: 4/4 kick, hi-hats, percussion, 909/808 sounds, ~130-140 BPM feel"
    ]